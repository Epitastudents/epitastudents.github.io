    tab('home'); header('Sources et méthode', null, null, '#/');
    render('<div class="card"><h2>D’où vient le contenu</h2><p>Du poly « Cours cinématique V4 », de la fiche coordonnées et des TD1 à TD8 de 2026 (Moodle), avec les notations du poly. Les corrections des TD1 à TD3 suivent les corrigés officiels ; celles des TD4 à TD8 sont proposées et signalées comme telles.</p>' +
      '<h2 style="margin-top:18px">Pourquoi l’appli est faite comme ça</h2><ul><li><b>Une idée par écran</b> : un cours découpé en étapes courtes, au rythme de l’élève, se comprend mieux (Rey et al., 2019).</li><li><b>Rien de décoratif</b> : ce qui n’a pas de rapport avec la leçon fait moins bien retenir. La couleur sert aux vecteurs et à la correction.</li><li><b>Se tester plutôt que relire</b> : tests et révision espacée sont les techniques les plus efficaces (Dunlosky et al., 2013).</li><li><b>Exemples guidés</b> : pour débuter, un exercice résolu étape par étape aide plus que chercher seul.</li></ul>' +
      '<h2 style="margin-top:18px">Tes données</h2><p>Tes réponses et ta progression restent sur cet appareil. Rien n’est envoyé.</p><button class="btn sec" type="button" id="wipe">Effacer ma progression</button><p class="small muted" id="wipeMsg"></p></div>');
    var armed = false;
    $('#wipe').onclick = function () {
      if (!armed) { armed = true; this.textContent = 'Confirmer : tout effacer'; return; }
      S = fresh(); save(); deck = null; this.textContent = 'Effacé'; $('#wipeMsg').textContent = 'Ta progression a été remise à zéro.';
    };
  }
  function notFound() { header('Mécanique S1'); render('<div class="card"><p>Page introuvable.</p><a class="btn" href="#/">Accueil</a></div>'); }

  /* ---------- Schéma polaire interactif ---------- */
  function initPolar() {
    var svg = $('#polarSvg'), range = $('#theta'); if (!svg || !range) return;
    var O = { x: 250, y: 205 }, R = 140, U = 72;
    function L(x1, y1, x2, y2, c, w, dash, arrow) { return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" class="ln ln-' + c + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + (arrow ? ' marker-end="url(#ar-' + c + ')"' : '') + '/>'; }
    function T(x, y, s, c, anchor, size, weight) { return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" class="tx tx-' + c + '" text-anchor="' + (anchor || 'start') + '" font-size="' + (size || 15) + '"' + (weight ? ' font-weight="' + weight + '"' : '') + '>' + s + '</text>'; }
    function draw(deg) {
      var t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
      var M = { x: O.x + R * c, y: O.y - R * s }, ur = { x: c, y: -s }, ut = { x: -s, y: -c }, h = '';
      h += '<circle cx="' + O.x + '" cy="' + O.y + '" r="' + R + '" class="ln ln-ink3" stroke-width="1" stroke-dasharray="3 5" fill="none"/>';
      h += L(30, O.y, 490, O.y, 'ink3', 1.4, null, true) + L(O.x, 385, O.x, 22, 'ink3', 1.4, null, true);
      h += T(496, O.y + 5, 'x', 'ink2', 'start', 14) + T(O.x + 10, 26, 'y', 'ink2', 'start', 14) + T(O.x - 8, O.y + 20, 'O', 'ink2', 'end', 14);
      h += L(M.x, M.y, M.x, O.y, 'ink3', 1.2, '5 5') + L(M.x, M.y, O.x, M.y, 'ink3', 1.2, '5 5');
      h += T(M.x, O.y + (s >= 0 ? 22 : -10), 'x = r cos θ', 'ink2', 'middle', 13);
      h += T(O.x + (c >= 0 ? -8 : 8), M.y + 4, 'y = r sin θ', 'ink2', c >= 0 ? 'end' : 'start', 13);
      var r = 38; if (deg > 0) h += '<path d="M' + (O.x + r) + ' ' + O.y + ' A' + r + ' ' + r + ' 0 ' + (deg > 180 ? 1 : 0) + ' 0 ' + (O.x + r * c).toFixed(1) + ' ' + (O.y - r * s).toFixed(1) + '" class="ln ln-ink" stroke-width="1.6" fill="none"/>';
      h += T(O.x + 56 * Math.cos(t / 2) - 4, O.y - 56 * Math.sin(t / 2) + 5, 'θ', 'ink', 'middle', 16, 700);
      h += L(O.x, O.y, M.x, M.y, 'ink', 2.2) + T((O.x + M.x) / 2 + 18 * ut.x, (O.y + M.y) / 2 + 18 * ut.y + 5, 'r', 'ink', 'middle', 16, 700);
      var e1 = { x: M.x + U * ur.x, y: M.y + U * ur.y }, e2 = { x: M.x + U * ut.x, y: M.y + U * ut.y };
      h += L(M.x, M.y, e1.x, e1.y, 'u1', 3.2, null, true) + L(M.x, M.y, e2.x, e2.y, 'u2', 3.2, null, true);
      var sub = function (g) { return '<tspan font-weight="700">u</tspan><tspan dy="5" font-size="0.75em" font-weight="700">' + g + '</tspan>'; };
      h += T(e1.x + 18 * ur.x, e1.y + 18 * ur.y + 5, sub('r'), 'u1', 'middle', 17) + T(e2.x + 18 * ut.x, e2.y + 18 * ut.y + 5, sub('θ'), 'u2', 'middle', 17);
      h += '<circle cx="' + M.x.toFixed(1) + '" cy="' + M.y.toFixed(1) + '" r="5" class="dot-ink"/>' + T(M.x - 14 * ur.x - 12 * ut.x, M.y - 14 * ur.y - 12 * ut.y + 5, 'M', 'ink', 'middle', 16, 700);
      svg.innerHTML = h; $('#thetaVal').textContent = deg + '°';
    }
    range.addEventListener('input', function () { draw(+range.value); });
    draw(35);
  }

  /* ---------- Routeur ---------- */
  function route() {
    var h = location.hash || '#/', p = h.slice(2).split('/');
    if (h.indexOf('#/cours/') === 0 || h.indexOf('#/exo/') === 0) { S.last = h; save(); }
    if (p[0] === '') return home();
    if (p[0] === 'cours') return p[1] ? lesson(p[1], parseInt(p[2], 10)) : coursList();
    if (p[0] === 'qcm') { if (p[1] === 'go') return qcmStart(p[2] || 'tout'); if (p[1] === 'q') return qcmQuestion(); return qcmSetup(); }
    if (p[0] === 'exos') return exosList(p[1]);
    if (p[0] === 'exo') return exo(p[1], parseInt(p[2], 10));
    if (p[0] === 'fiches') { deck = null; return fiches(); }
    if (p[0] === 'annales') return annales();
    if (p[0] === 'apropos') return apropos();
    notFound();
  }
  window.addEventListener('hashchange', route);
  $$('.nav a').forEach(function (a) { a.addEventListener('click', function (e) { if (location.hash === a.getAttribute('href') || (a.getAttribute('href') === '#/' && !location.hash)) { e.preventDefault(); route(); } }); });
  route();

  /* ---------- Mises à jour : la nouvelle version s'installe toute seule ---------- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloaded) return;
      var onHome = !location.hash || location.hash === '#/';
      if (onHome || document.visibilityState === 'hidden') { reloaded = true; location.reload(); }
      else { $('#updToast').hidden = false; $('#updGo').onclick = function () { reloaded = true; location.reload(); }; }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
      }).catch(function () {});
    });
  }
})();
</script>
