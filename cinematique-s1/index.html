<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Méca S1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mécanique S1</title>
<meta name="description" content="Révisions de mécanique S1 : le cours en fiches courtes, QCM corrigés, exercices de TD guidés et cartes mémoire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Mise en page : téléphone = onglets en bas ; PC = menu à gauche. Une colonne de lecture de 44rem.
   Les boutons d'action restent collés en bas de l'écran. Couleur réservée au sens (vecteurs, juste/faux, action). */
:root {
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --line: #E4E7EC;
  --soft: #EEF1F5;
  --ink: #14171C;
  --ink-2: #4A5160;
  --ink-3: #8A91A1;
  --accent: #2F5BEA;
  --accent-soft: #E8EEFD;
  --accent-ink: #FFFFFF;
  --good: #187A43;
  --good-soft: #E3F4EA;
  --bad: #B8332A;
  --bad-soft: #FCEBEA;
  --v: #1262D2; --a: #C8371D; --u1: #7A3BD0; --u2: #0B8574;
  --area: rgba(18, 98, 210, 0.08);
  --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 2px 8px rgba(20, 23, 28, 0.04);
  --f: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fh: "Lexend", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  --nav-h: 62px;
  --side: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --card: #181B21; --line: #2A2E37; --soft: #22262E; --ink: #ECEEF2; --ink-2: #AEB4C1; --ink-3: #7A8090;
    --accent: #86A6FF; --accent-soft: #1E2740; --accent-ink: #0D1120; --good: #5BC98A; --good-soft: #142A1D; --bad: #FF8C80; --bad-soft: #301917;
    --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --card: #181B21; --line: #2A2E37; --soft: #22262E; --ink: #ECEEF2; --ink-2: #AEB4C1; --ink-3: #7A8090;
  --accent: #86A6FF; --accent-soft: #1E2740; --accent-ink: #0D1120; --good: #5BC98A; --good-soft: #142A1D; --bad: #FF8C80; --bad-soft: #301917;
  --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 var(--f); }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--fh); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.15rem; }
p { margin: 0.5rem 0; }
ul, ol { margin: 0.5rem 0; padding-left: 1.3rem; }
li + li { margin-top: 0.35rem; }

/* ---------- Structure ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 46rem; margin: 0 auto; padding-inline: 16px; height: 56px; display: flex; align-items: center; gap: 8px; }
.back { flex: 0 0 auto; width: 40px; height: 40px; margin-left: -8px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.back:hover { background: var(--soft); }
.back svg { width: 22px; height: 22px; }
.top-title { flex: 1; min-width: 0; font-family: var(--fh); font-weight: 600; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-count { font-size: 0.86rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; border-radius: 0 2px 2px 0; }
main { max-width: 46rem; margin: 0 auto; padding: 12px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); outline: none; }
.stack { display: grid; gap: 14px; }
.stack > *, .duo > *, .actions > * { min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.88rem; }
.label { font-family: var(--fh); font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; cursor: pointer; user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.sec { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { position: sticky; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: grid; grid-template-columns: 1fr 1.7fr; gap: 10px; margin-top: 18px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px rgba(20, 23, 28, 0.10); }
.actions.one { grid-template-columns: 1fr; }
.kbd-hint { text-align: center; font-size: 0.8rem; color: var(--ink-3); margin-top: 8px; }

/* ---------- Listes ---------- */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 64px; }
.item:hover { border-color: var(--ink-3); }
.item .grow { flex: 1; min-width: 0; }
.num { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--fh); font-weight: 600; font-size: 0.95rem; background: var(--accent-soft); color: var(--accent); }
.num.done { background: var(--good); color: var(--card); }
.item .t { font-weight: 700; display: block; line-height: 1.3; }
.item .s { display: block; font-size: 0.86rem; color: var(--ink-2); margin-top: 2px; }
.meter { height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.chev { color: var(--ink-3); flex: 0 0 auto; font-size: 1.4rem; line-height: 1; }

/* ---------- Accueil ---------- */
.hello { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; margin: 8px 0 2px; }
.resume { display: block; text-decoration: none; color: var(--ink); background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.resume .label { color: inherit; opacity: 0.85; }
.resume .t { display: block; font-family: var(--fh); font-size: 1.25rem; font-weight: 600; margin: 4px 0 10px; }
.resume .meter { background: rgba(255,255,255,0.3); }
.resume .meter i { background: var(--accent-ink); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); padding: 14px; }
.tile b { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.tile span { font-size: 0.9rem; color: var(--ink-2); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }

/* ---------- Fiche de cours ---------- */
.lesson h1 { font-size: 1.45rem; margin-bottom: 8px; }
.meta { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 6px; }
.key { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 16px 0; overflow-x: auto; }
.key .label { display: block; color: var(--accent); margin-bottom: 2px; }
.trap { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); font-size: 0.95rem; }
.trap b { color: var(--bad); }
.fig { margin: 16px 0 0; }
.fig svg { max-height: min(38vh, 320px); max-width: 100%; display: block; margin: 0 auto; }
.fig-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 0.8rem; color: var(--ink-2); }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { margin: 0.35em 0 !important; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

/* ---------- QCM ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--card); color: var(--ink); cursor: pointer; font-size: 0.92rem; min-height: 42px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.q-text { font-size: 1.15rem; font-weight: 700; line-height: 1.45; margin: 4px 0 16px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 58px; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 10px 14px; cursor: pointer; overflow-x: auto; }
.opt:hover:not(:disabled) { border-color: var(--ink-3); }
.opt .k { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--fh); font-weight: 600; font-size: 0.85rem; background: var(--soft); color: var(--ink-2); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .k { background: var(--good); color: var(--card); }
.opt.ko { border-color: var(--bad); background: var(--bad-soft); }
.opt.ko .k { background: var(--bad); color: var(--card); }
.opt:disabled { cursor: default; }
.fb { margin-top: 14px; padding: 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.fb b.ok { color: var(--good); }
.fb b.ko { color: var(--bad); }
.score { font-family: var(--fh); font-size: 3rem; font-weight: 700; line-height: 1; margin: 8px 0; }

/* ---------- Exercices ---------- */
.enonce { font-size: 0.95rem; }
.step-q { font-weight: 700; font-size: 1.05rem; margin: 0 0 10px; }
textarea { display: block; width: 100%; min-height: 96px; resize: vertical; font: 1rem/1.5 var(--f); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
textarea:focus { border-color: var(--accent); outline: none; background: var(--card); }
.reveal { margin-top: 10px; padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.reveal.hint { background: var(--soft); }
.reveal.corr { background: var(--good-soft); }
.tag { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-2); margin-right: 4px; }
.steps-dots { display: flex; gap: 5px; margin: 2px 0 10px; }
.steps-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps-dots i.on { background: var(--accent); }

/* ---------- Fiches mémoire ---------- */
.flash { min-height: 300px; display: grid; align-content: center; gap: 14px; text-align: center; cursor: pointer; }
.flash .front { font-family: var(--fh); font-size: 1.2rem; font-weight: 600; }
.flash .answer { font-size: 1.1rem; border-top: 1px dashed var(--line); padding-top: 14px; overflow-x: auto; }
.flash .tap { font-size: 0.85rem; color: var(--ink-3); }

/* ---------- Navigation ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 46rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav a { display: grid; justify-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--ink-3); font-size: 0.72rem; font-weight: 700; position: relative; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav .brand-side { display: none; }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 0.68rem; line-height: 18px; text-align: center; }

@media (min-width: 960px) {
  body { padding-left: var(--side); }
  .nav { top: 0; right: auto; width: var(--side); border-top: 0; border-right: 1px solid var(--line); padding: 20px 12px; }
  .nav-in { display: grid; grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px; height: auto; max-width: none; }
  .nav .brand-side { display: block; font-family: var(--fh); font-weight: 700; font-size: 1.15rem; color: var(--ink); padding: 4px 12px 18px; }
  .nav a { display: flex; align-items: center; gap: 12px; justify-items: start; padding: 10px 12px; border-radius: 10px; font-size: 0.98rem; color: var(--ink-2); }
  .nav a:hover { background: var(--soft); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav a svg { width: 22px; height: 22px; }
  .badge { position: static; margin-left: auto; }
  main { padding-bottom: 40px; padding-top: 18px; }
  .actions { bottom: 16px; }
  .top-in, main { max-width: 48rem; }
}

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px 12px 18px; box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 0.95rem; }
.toast button { border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 700; border: 0; background: var(--bg); color: var(--ink); }

/* ---------- Schémas ---------- */
.fig-svg { width: 100%; height: auto; display: block; max-height: min(42vh, 360px); }
.fig-svg.mini, .fig-svg.half { max-width: 460px; margin: 0 auto; }
.fig-svg.icon { max-width: 160px; margin: 0 auto; }
.ln { fill: none; stroke-linecap: round; }
.ln-ink { stroke: var(--ink); } .ln-ink2 { stroke: var(--ink-2); } .ln-ink3 { stroke: var(--ink-3); }
.ln-v { stroke: var(--v); } .ln-a { stroke: var(--a); } .ln-u1 { stroke: var(--u1); } .ln-u2 { stroke: var(--u2); }
.mk-ink { fill: var(--ink); } .mk-ink2 { fill: var(--ink-2); } .mk-ink3 { fill: var(--ink-3); }
.mk-v { fill: var(--v); } .mk-a { fill: var(--a); } .mk-u1 { fill: var(--u1); } .mk-u2 { fill: var(--u2); }
.tx { font-family: var(--f); }
.tx-ink { fill: var(--ink); } .tx-ink2 { fill: var(--ink-2); } .tx-ink3 { fill: var(--ink-3); }
.tx-v { fill: var(--v); } .tx-a { fill: var(--a); } .tx-u1 { fill: var(--u1); } .tx-u2 { fill: var(--u2); }
.dot-ink { fill: var(--ink); } .dot-ink2 { fill: var(--ink-2); } .dot-ink3 { fill: var(--ink-3); }
.area { fill: var(--area); stroke: none; }
.cv { color: var(--v); } .ca { color: var(--a); } .c1 { color: var(--u1); } .c2 { color: var(--u2); }
.polar-ctl { display: grid; gap: 6px; margin-top: 8px; }
.polar-ctl input { width: 100%; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-ink"/></marker>
    <marker id="ar-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-ink2"/></marker>
    <marker id="ar-ink3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-ink3"/></marker>
    <marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-v"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-a"/></marker>
    <marker id="ar-u1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-u1"/></marker>
    <marker id="ar-u2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-u2"/></marker>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <button class="back" id="topBack" type="button" hidden aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="top-title" id="topTitle">Mécanique S1</span>
    <span class="top-count" id="topCount"></span>
  </div>
  <div class="bar" id="topBar" hidden><i></i></div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="nav" aria-label="Navigation principale">
  <div class="nav-in">
    <span class="brand-side">Mécanique S1</span>
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</a>
    <a href="#/cours" data-tab="cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>Cours</a>
    <a href="#/qcm" data-tab="qcm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.5L16 9.5"/></svg>QCM</a>
    <a href="#/exos" data-tab="exos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>TD</a>
    <a href="#/fiches" data-tab="fiches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Fiches<span class="badge" id="navBadge" hidden></span></a>
  </div>
