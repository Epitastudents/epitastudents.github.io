<script id="data" type="application/json">{"chapitres": [{"id": "maths", "n": 0, "titre": "Rappels de maths", "td": null, "pages": "Prérequis", "resume": "Vecteurs, produit scalaire, trigo, dérivées et primitives."}, {"id": "cine", "n": 1, "titre": "Cinématique en cartésiennes", "td": "TD1", "pages": "Poly p. 1 à 3", "resume": "Position, vitesse, accélération, trajectoire."}, {"id": "forces", "n": 2, "titre": "Forces et lois de Newton", "td": "TD2", "pages": "Poly p. 4 à 6", "resume": "Les 3 lois de Newton, les forces usuelles, l’équilibre."}, {"id": "dyn", "n": 3, "titre": "Utiliser le PFD", "td": "TD3", "pages": "Poly p. 6 à 8", "resume": "Chute libre, tir, frottements, vitesse limite."}, {"id": "energie", "n": 4, "titre": "Travail et énergie", "td": "TD4", "pages": "Poly p. 8 à 10", "resume": "Travail, puissance, énergie cinétique, potentielle, mécanique."}, {"id": "polaires", "n": 5, "titre": "Coordonnées polaires", "td": "TD5", "pages": "Poly p. 11 et 12, fiche coordonnées", "resume": "Base mobile, vitesse et accélération, mouvement circulaire."}, {"id": "osc", "n": 6, "titre": "Oscillateur harmonique", "td": "TD6", "pages": "Poly p. 13 à 17", "resume": "Ressort, équation différentielle, solution, énergie."}, {"id": "pendule", "n": 7, "titre": "Pendule et amortissement", "td": "TD7", "pages": "Poly p. 18 et 19", "resume": "Pendule simple, frottements, trois régimes."}, {"id": "ondes", "n": 8, "titre": "Ondes et signaux", "td": "TD8", "pages": "Poly p. 20 à 24", "resume": "Période, longueur d’onde, OPPM, ondes stationnaires."}], "lecons": {"maths": [{"t": "Composantes d’un vecteur", "h": "<p>Un vecteur de norme F qui fait un angle α avec l’axe Ox se découpe en deux composantes. Le côté <b>collé à l’angle<\/b> reçoit le cos, l’autre reçoit le sin. Le signe dépend du sens de la flèche.<\/p>", "k": "\\[\\vec F = \\begin{pmatrix} F\\cos\\alpha \\\\ F\\sin\\alpha \\end{pmatrix}\\]\\[\\|\\vec F\\| = \\sqrt{F_x^2 + F_y^2}\\]", "fig": "PROJ_X", "piege": "Si l’angle est mesuré depuis l’axe vertical, c’est l’inverse : le cos va sur y."}, {"t": "Produit scalaire", "h": "<p>Le produit scalaire donne un <b>nombre<\/b>. Il sert à savoir si deux vecteurs vont dans le même sens, et à calculer un travail.<\/p>", "k": "\\[\\vec U\\cdot\\vec V = U_xV_x + U_yV_y = UV\\cos\\alpha\\]", "fig": "SC3", "piege": "Perpendiculaires : produit nul. Sens opposés : produit négatif."}, {"t": "Trigonométrie utile", "h": "<p>Valeurs à connaître : \\(\\cos 30° = \\frac{\\sqrt3}{2}\\), \\(\\sin 30° = \\frac12\\), \\(\\cos 60° = \\frac12\\), \\(\\cos 45° = \\sin 45° = \\frac{\\sqrt2}{2}\\).<\/p>", "k": "\\[\\cos^2x + \\sin^2x = 1\\]\\[\\cos 2x = 1 - 2\\sin^2x\\]\\[\\sin 2x = 2\\sin x\\cos x\\]"}, {"t": "Dériver et intégrer", "h": "<p>Un point au-dessus d’une lettre = dérivée par rapport au temps : \\(\\dot x = \\frac{dx}{dt}\\). Pour une fonction composée, on multiplie par la dérivée de l’intérieur : \\((\\cos\\omega t)' = -\\omega\\sin\\omega t\\), \\((e^{-t/\\tau})' = -\\frac1\\tau e^{-t/\\tau}\\).<\/p>", "k": "\\[\\int a\\,dt = a\\,t + C\\]\\[\\int t\\,dt = \\frac{t^2}{2} + C\\]", "piege": "Toujours fixer la constante C avec la condition initiale (valeur à t = 0)."}], "cine": [{"t": "Les mots du chapitre", "h": "<ul><li><b>Point matériel<\/b> : on néglige la taille et la rotation de l’objet.<\/li><li><b>Référentiel<\/b> : le repère d’espace et de temps choisi. Il est <b>galiléen<\/b> s’il ne subit aucune accélération (le référentiel terrestre l’est presque).<\/li><li><b>Équations horaires<\/b> : x(t), y(t).<\/li><li><b>Trajectoire<\/b> : la courbe suivie. Son équation ne contient plus t.<\/li><\/ul>"}, {"t": "La position", "h": "<p>En cartésiennes, la base \\((\\vec u_x, \\vec u_y)\\) est <b>fixe<\/b>. Le point M est repéré par ses projections x et y.<\/p>", "k": "\\[\\OM(t) = x\\,\\vec u_x + y\\,\\vec u_y = \\begin{pmatrix} x \\\\ y \\end{pmatrix}\\]"}, {"t": "La vitesse", "h": "<p>On dérive la position. La vitesse est toujours <b>tangente à la trajectoire<\/b>. Unité : m·s⁻¹.<\/p>", "k": "\\[\\V = \\frac{d\\OM}{dt} = \\begin{pmatrix} \\dot x \\\\ \\dot y \\end{pmatrix}\\]\\[\\|\\V\\| = \\sqrt{\\dot x^2 + \\dot y^2}\\]", "fig": "TRAJ"}, {"t": "L’accélération", "h": "<p>On dérive encore une fois. Unité : m·s⁻². Elle est tournée vers l’intérieur des virages.<\/p>", "k": "\\[\\A = \\frac{d\\V}{dt} = \\begin{pmatrix} \\ddot x \\\\ \\ddot y \\end{pmatrix}\\]", "piege": "L’accélération est la dérivée seconde, pas le carré de la vitesse."}, {"t": "Accéléré ou décéléré ?", "h": "<p>Le signe de \\(\\V\\cdot\\A\\) donne la réponse.<\/p><ul><li>\\(\\V\\cdot\\A > 0\\) : <b>accéléré<\/b>.<\/li><li>\\(\\V\\cdot\\A = 0\\) : seule la direction change (virage à vitesse constante).<\/li><li>\\(\\V\\cdot\\A < 0\\) : <b>décéléré<\/b>.<\/li><\/ul>", "fig": "SP3", "piege": "x = 10 − 2t² : v = −4t et a = −4. Même signe, donc accéléré, même si v est négative."}, {"t": "Trouver la trajectoire", "h": "<p>On <b>élimine t<\/b>. Si t apparaît seul dans x(t), on l’isole et on remplace dans y(t). Exemple du tir (TD1) : \\(x = v_0\\cos\\alpha\\,t\\) donne \\(t = \\frac{x}{v_0\\cos\\alpha}\\).<\/p>", "k": "\\[y(x) = -\\frac{g\\,x^2}{2v_0^2\\cos^2\\alpha} + x\\tan\\alpha\\]", "piege": "Avec un cos et un sin du même angle, on utilise plutôt cos² + sin² = 1 (cercle, ellipse)."}, {"t": "Remonter de a à x", "h": "<p>Si on connaît l’accélération, on intègre deux fois. Les constantes viennent des conditions initiales. Exemple (TD1) : a = 5 m·s⁻², v(0) = 0, x(0) = 7 m.<\/p>", "k": "\\[v(t) = a\\,t + v(0)\\]\\[x(t) = \\frac{a\\,t^2}{2} + v(0)\\,t + x(0)\\]"}, {"t": "Méthode : analyser un mouvement", "h": "<ol><li>Cadre : référentiel, système, coordonnées.<\/li><li>Écrire \\(\\OM\\).<\/li><li>Dériver pour \\(\\V\\), puis pour \\(\\A\\).<\/li><li>Calculer les normes.<\/li><li>Interpréter : sur chaque axe, uniforme, accéléré ou décéléré, et dans quel sens.<\/li><\/ol>"}], "forces": [{"t": "Masse, force, quantité de mouvement", "h": "<ul><li><b>Masse<\/b> m (kg) : résistance d’un corps à sa mise en mouvement.<\/li><li><b>Force<\/b> \\(\\vec F\\) (N = kg·m·s⁻²) : décrit une interaction.<\/li><li><b>Quantité de mouvement<\/b> \\(\\vec p = m\\V\\) (kg·m·s⁻¹).<\/li><\/ul>"}, {"t": "Les trois lois de Newton", "h": "<ol><li><b>Inertie<\/b> : sans interaction, un point reste au repos ou en mouvement rectiligne uniforme (référentiel galiléen).<\/li><li><b>PFD<\/b> : la somme des forces égale la dérivée de \\(\\vec p\\).<\/li><li><b>Action-réaction<\/b> : \\(\\vec F_{2\\to1} = -\\vec F_{1\\to2}\\).<\/li><\/ol>", "k": "\\[\\sum_i \\vec F_i = \\frac{d\\vec p}{dt} = m\\,\\A\\]"}, {"t": "Forces à distance", "h": "<p><b>Gravitation<\/b> : toujours attractive, \\(F = G\\frac{m_1m_2}{d^2}\\), G = 6,67·10⁻¹¹ N·m²·kg⁻². Près du sol, elle devient le <b>poids<\/b>. <b>Force de Coulomb<\/b> : \\(F = k\\frac{q_1q_2}{d^2}\\), k = 9·10⁹ N·m²·C⁻², attractive ou répulsive selon le signe des charges.<\/p>", "k": "\\[\\vec P = m\\,\\vec g\\]\\[g \\approx 9{,}81\\ \\text{m·s}^{-2}\\]"}, {"t": "Forces de contact", "h": "<ul><li><b>Réaction<\/b> \\(\\vec R\\) : toujours perpendiculaire au support.<\/li><li><b>Frottement fluide<\/b> : \\(\\vec f = -\\alpha\\V\\), s’oppose au mouvement.<\/li><li><b>Tension<\/b> \\(\\vec T\\) : le long du fil, de l’objet vers le fil.<\/li><\/ul>", "piege": "La réaction et la tension n’ont pas de formule : on les trouve avec le PFD."}, {"t": "Méthode : le bilan des forces", "h": "<ol><li>Référentiel (terrestre, supposé galiléen).<\/li><li>Système (point matériel).<\/li><li>Forces : faire un schéma, une flèche par force.<\/li><li>Choisir une base adaptée.<\/li><li>Écrire le PFD, puis le projeter sur chaque axe.<\/li><\/ol>"}, {"t": "Équilibre sur une pente", "h": "<p>À l’équilibre, la somme des forces est nulle. On prend un axe le long de la pente et un axe perpendiculaire, et on décompose le poids (TD2).<\/p>", "k": "\\[\\vec P = \\begin{pmatrix} mg\\sin\\alpha \\\\ -mg\\cos\\alpha \\end{pmatrix}\\]\\[\\Rightarrow  R = mg\\cos\\alpha,\\ \\ f = mg\\sin\\alpha\\]", "fig": "INCLINE"}, {"t": "Vérifier les unités", "h": "<p>Chaque terme d’une égalité a la même unité. Exemple (TD2) : dans \\(f = \\alpha v\\), f est en N = kg·m·s⁻² et v en m·s⁻¹.<\/p>", "k": "\\[[\\alpha] = \\frac{\\text{kg·m·s}^{-2}}{\\text{m·s}^{-1}} = \\text{kg·s}^{-1}\\]"}], "dyn": [{"t": "Du PFD aux équations horaires", "h": "<p>Le PFD donne l’accélération. On intègre pour la vitesse, puis pour la position. Chaque intégration ajoute une constante, fixée par les conditions initiales.<\/p>", "k": "\\[\\A \\xrightarrow{\\ \\int dt\\ } \\V \\xrightarrow{\\ \\int dt\\ } \\OM\\]"}, {"t": "Chute libre", "h": "<p>Seule force : le poids. Axe y vers le haut : \\(-mg = ma\\), donc \\(a = -g\\). L’accélération <b>ne dépend pas de la masse<\/b>. Départ sans vitesse d’une hauteur y₀ :<\/p>", "k": "\\[v = -g\\,t\\]\\[y = -\\frac{g\\,t^2}{2} + y_0\\]\\[T_{chute} = \\sqrt{\\frac{2y_0}{g}}\\]"}, {"t": "Le tir parabolique", "h": "<p>Lancé avec v₀ et un angle α, sans frottement (TD1, TD3) : sur x, mouvement uniforme ; sur y, chute libre.<\/p>", "k": "\\[x = v_0\\cos\\alpha\\,t\\]\\[y = v_0\\sin\\alpha\\,t - \\frac{g\\,t^2}{2}\\]", "fig": "PROJECTILE", "piege": "Au sommet, seule la vitesse verticale est nulle : \\(v_y = 0\\), pas \\(\\V = \\vec 0\\)."}, {"t": "Portée et sommet", "h": "<p>Sommet : \\(v_y(t_S) = 0\\), donc \\(t_S = \\frac{v_0\\sin\\alpha}{g}\\). Portée : y = 0 de nouveau, à \\(t = 2t_S\\).<\/p>", "k": "\\[x_{max} = \\frac{2v_0^2\\sin\\alpha\\cos\\alpha}{g}\\]\\[y_S = \\frac{v_0^2\\sin^2\\alpha}{2g}\\]"}, {"t": "Force constante : l’inertie", "h": "<p>Un robot poussé par une force F horizontale, sans frottement (TD2) : \\(a = F/m\\). Plus la masse est grande, plus il est dur de le faire accélérer.<\/p>", "k": "\\[v(t) = \\frac Fm\\,t + v_0\\]\\[x(t) = \\frac{F}{2m}t^2 + v_0\\,t\\]"}, {"t": "Avec frottement : vitesse limite", "h": "<p>Parachutiste (TD3) : \\(m\\frac{dv}{dt} = -mg - \\alpha v\\). On obtient une <b>équation différentielle du 1er ordre<\/b>.<\/p>", "k": "\\[\\frac{dv}{dt} + \\frac{v}{\\tau} = -g \\quad \\text{avec}\\quad \\tau = \\frac m\\alpha\\]\\[v(t) = g\\tau\\left(e^{-t/\\tau} - 1\\right)\\]", "piege": "Vitesse limite : quand t est grand, |v| → gτ. On la retrouve aussi en écrivant que les forces se compensent : αv = mg."}, {"t": "Résoudre dv/dt + v/τ = constante", "h": "<ol><li>Solution sans second membre : \\(A\\,e^{-t/\\tau}\\).<\/li><li>Solution particulière constante : \\(\\frac{dv}{dt} = 0\\), donc \\(v_p = -g\\tau\\).<\/li><li>Somme des deux, puis A avec v(0).<\/li><\/ol>"}], "energie": [{"t": "Le travail d’une force", "h": "<p>Le travail mesure la capacité d’une force à faire varier la vitesse. Seule la partie de la force <b>parallèle au déplacement<\/b> travaille. Unité : joule (J).<\/p>", "k": "\\[W_{A\\to B} = \\int_A^B \\vec F\\cdot d\\vec l\\]\\[\\text{force constante : } W = \\vec F\\cdot\\overrightarrow{AB} = F\\cdot AB\\cos\\theta\\]", "fig": "WORK"}, {"t": "Moteur, résistant, nul", "h": "<ul><li>W &gt; 0 : <b>moteur<\/b>, le système accélère.<\/li><li>W = 0 : la force ne change que la direction (ex. la réaction \\(\\vec R\\) perpendiculaire).<\/li><li>W &lt; 0 : <b>résistant<\/b>, le système ralentit (ex. frottements).<\/li><\/ul>", "k": "\\[W(\\vec P) = mg\\,(z_A - z_B)\\]", "piege": "Le travail du poids est positif quand l’objet descend."}, {"t": "La puissance", "h": "<p>La puissance dit à quelle vitesse une force travaille. Unité : watt (W = J/s).<\/p>", "k": "\\[P = \\frac{dW}{dt} = \\vec F\\cdot\\V\\]"}, {"t": "Théorème de l’énergie cinétique", "h": "<p>La variation d’énergie cinétique est égale à la somme des travaux de <b>toutes<\/b> les forces.<\/p>", "k": "\\[E_c = \\frac12 m v^2\\]\\[\\sum W_i = \\Delta E_c = \\frac12 m v_B^2 - \\frac12 m v_A^2\\]"}, {"t": "Énergies potentielles", "h": "<p>Une force est <b>conservative<\/b> si son travail ne dépend pas du chemin (poids, ressort). Elle dérive d’une énergie potentielle : \\(W = -\\Delta E_p\\).<\/p>", "k": "\\[E_{pp} = m\\,g\\,h\\]\\[E_{pe} = \\frac12 k\\,x^2\\]"}, {"t": "Énergie mécanique", "h": "<p>Sans frottement, l’énergie mécanique se conserve. Les frottements, non conservatifs, la font diminuer.<\/p>", "k": "\\[E_M = E_c + E_p = \\text{constante}\\]", "piege": "Chute libre d’une hauteur H : mgH = ½mv² donne \\(v = \\sqrt{2gH}\\), quelle que soit la masse."}, {"t": "Méthode : quel théorème ?", "h": "<ul><li>Pas de frottement : <b>énergie mécanique<\/b> constante, c’est le plus rapide.<\/li><li>Frottements ou force motrice : <b>TEC<\/b>, en listant le travail de chaque force.<\/li><li>On cherche une durée ou une position à un instant donné : revenir au <b>PFD<\/b>.<\/li><\/ul>"}], "polaires": [{"t": "Repérer un point en polaires", "h": "<p>M est repéré par sa distance <b>r = OM<\/b> (toujours positive) et l’angle <b>θ<\/b> entre \\(\\vec u_x\\) et \\(\\OM\\). C’est le système adapté aux mouvements circulaires. Fais tourner M :<\/p>", "k": "\\[\\OM = r\\,\\ur\\]", "fig": "POLAR", "piege": "Pas de terme en θ dans la position : θ est un angle, pas une longueur."}, {"t": "La base mobile", "h": "<p>\\(\\ur\\) pointe de O vers M. \\(\\ut\\) est \\(\\ur\\) tourné de +90°. Cette base <b>tourne avec M<\/b>.<\/p>", "k": "\\[\\ur = \\cos\\theta\\,\\vec u_x + \\sin\\theta\\,\\vec u_y\\]\\[\\ut = -\\sin\\theta\\,\\vec u_x + \\cos\\theta\\,\\vec u_y\\]"}, {"t": "Dériver la base", "h": "<p>En dérivant par rapport à θ, puis en multipliant par \\(\\dot\\theta\\) (dérivée composée) :<\/p>", "k": "\\[\\frac{d\\ur}{dt} = \\dot\\theta\\,\\ut\\]\\[\\frac{d\\ut}{dt} = -\\dot\\theta\\,\\ur\\]", "piege": "Astuce : dériver un vecteur de la base, c’est le tourner de +90° et multiplier par θ̇."}, {"t": "La vitesse en polaires", "h": "<p>On dérive le produit \\(r\\,\\ur\\) : \\(\\dot r\\,\\ur + r\\,\\frac{d\\ur}{dt}\\).<\/p>", "k": "\\[\\V = \\dot r\\,\\ur + r\\dot\\theta\\,\\ut\\]"}, {"t": "L’accélération en polaires", "h": "<p>On dérive encore une fois et on regroupe les termes. Formule donnée dans les énoncés (TD7), mais à savoir retrouver.<\/p>", "k": "\\[\\A = (\\ddot r - r\\dot\\theta^2)\\,\\ur + (2\\dot r\\dot\\theta + r\\ddot\\theta)\\,\\ut\\]"}, {"t": "Mouvement circulaire", "h": "<p>Sur un cercle, r = R est constant : \\(\\dot r = \\ddot r = 0\\). S’il est uniforme, \\(\\dot\\theta = \\omega\\) est constante (TD5, manège).<\/p>", "k": "\\[\\V = R\\omega\\,\\ut\\]\\[\\A = -R\\omega^2\\,\\ur\\]\\[a = R\\omega^2 = \\frac{v^2}{R}\\]", "fig": "CIRC_U", "piege": "En circulaire uniforme, l’accélération n’est pas nulle : elle pointe vers le centre."}, {"t": "Exemple : le satellite", "h": "<p>Orbite circulaire (TD5). Le PFD avec la gravitation sur \\(\\ur\\) donne \\(r\\omega^2 = \\frac{GM_T}{r^2}\\). Sur \\(\\ut\\) : \\(r\\ddot\\theta = 0\\), donc ω est constante.<\/p>", "k": "\\[v = \\sqrt{\\frac{GM_T}{r}}\\]\\[T = \\frac{2\\pi r}{v}\\]"}, {"t": "Cylindriques et sphériques", "h": "<p>Fiche coordonnées. <b>Cylindriques<\/b> : polaires + une hauteur z, \\(\\OM = r\\,\\ur + z\\,\\vec u_z\\), volume élémentaire dV = r dr dθ dz. <b>Sphériques<\/b> : r = OM et deux angles θ et φ, \\(\\OM = r\\,\\ur\\), dV = r² sin θ dr dθ dφ.<\/p>", "piege": "En sphériques, r est la distance OM ; en cylindriques, c’est la distance à l’axe Oz."}], "osc": [{"t": "La force de rappel", "h": "<p>Un ressort de raideur k (N/m) et de longueur à vide l₀ exerce une force proportionnelle à son allongement Δl = l − l₀. Avec l’origine à l’équilibre, Δl = x.<\/p>", "k": "\\[\\vec F_{rappel} = -k\\,\\Delta l\\,\\vec u_x = -k\\,x\\,\\vec u_x\\]", "fig": "SPRING", "piege": "Étiré (x > 0) : la force tire vers la gauche. Comprimé (x < 0) : elle pousse vers la droite."}, {"t": "L’équation de l’oscillateur", "h": "<p>PFD projeté sur x (poids et réaction se compensent) : \\(-kx = m\\ddot x\\).<\/p>", "k": "\\[\\ddot x + \\omega_0^2\\,x = 0\\]\\[\\omega_0 = \\sqrt{\\frac km}\\]"}, {"t": "La solution", "h": "<p>Solution générale, puis A et B avec les conditions initiales x(0) = x₀ et v(0) = v₀.<\/p>", "k": "\\[x(t) = A\\cos(\\omega_0t) + B\\sin(\\omega_0t)\\]\\[\\Rightarrow  x(t) = x_0\\cos(\\omega_0t) + \\frac{v_0}{\\omega_0}\\sin(\\omega_0t)\\]", "piege": "B se trouve avec la vitesse : dérive x(t), puis pose t = 0."}, {"t": "Amplitude et période", "h": "<p>On peut aussi écrire \\(x(t) = A\\cos(\\omega_0t + \\varphi)\\) : A est l’amplitude (m), φ la phase à l’origine (rad). Les oscillations sont d’amplitude constante.<\/p>", "k": "\\[T_0 = \\frac{2\\pi}{\\omega_0} = 2\\pi\\sqrt{\\frac mk}\\]", "fig": "OSC"}, {"t": "Énergie de l’oscillateur", "h": "<p>L’énergie passe sans cesse du cinétique au potentiel élastique. Ec est maximale au passage à l’équilibre, Epe aux extrémités.<\/p>", "k": "\\[E_c = \\frac12 mv^2\\]\\[E_{pe} = \\frac12 kx^2\\]\\[E_M = \\frac12 kA^2\\]"}, {"t": "Ressort vertical", "h": "<p>Le poids décale la position d’équilibre (TD6). On pose \\(Z = z - z_e\\) : on retrouve exactement la même équation.<\/p>", "k": "\\[\\ddot Z + \\omega_0^2 Z = 0\\]\\[\\omega_0 = \\sqrt{\\frac km}\\]", "piege": "La forme de la force dépend de l’orientation de l’axe : fais toujours un schéma."}], "pendule": [{"t": "Le pendule simple", "h": "<p>Une masse au bout d’un fil de longueur l. Forces : poids et tension. On travaille en polaires avec r = l constant.<\/p>", "k": "\\[\\A = -l\\dot\\theta^2\\,\\ur + l\\ddot\\theta\\,\\ut\\]", "fig": "PENDULE"}, {"t": "L’équation du pendule", "h": "<p>Projection sur \\(\\ut\\) : \\(ml\\ddot\\theta = -mg\\sin\\theta\\). Pour les petits angles, sin θ ≈ θ.<\/p>", "k": "\\[\\ddot\\theta + \\frac gl\\,\\theta = 0\\]\\[\\omega_0 = \\sqrt{\\frac gl}\\]\\[T_0 = 2\\pi\\sqrt{\\frac lg}\\]", "piege": "La période ne dépend pas de la masse."}, {"t": "Le pendule par l’énergie", "h": "<p>Avec l’origine en bas : \\(E_p = mgl(1 - \\cos\\theta)\\) et \\(E_c = \\frac12 ml^2\\dot\\theta^2\\). Sans frottement, \\(E_M\\) est constante : on dérive et on retrouve la même équation (TD7).<\/p>", "k": "\\[\\theta(t) = \\theta_0\\cos(\\omega_0 t)\\]"}, {"t": "Ajouter un frottement fluide", "h": "<p>Avec \\(\\vec f = -\\alpha\\V\\), le PFD donne une équation avec un terme en \\(\\dot x\\).<\/p>", "k": "\\[\\ddot x + \\frac1\\tau\\,\\dot x + \\omega_0^2\\,x = 0\\]\\[\\tau = \\frac m\\alpha\\]"}, {"t": "Les trois régimes", "h": "<p>On pose \\(\\lambda = \\frac{1}{2\\tau}\\) et on compare à ω₀.<\/p><ul><li><b>Pseudo-périodique<\/b> (λ &lt; ω₀) : oscillations qui s’amortissent.<\/li><li><b>Critique<\/b> (λ = ω₀) : retour à l’équilibre le plus rapide.<\/li><li><b>Apériodique<\/b> (λ &gt; ω₀) : retour lent, sans oscillation.<\/li><\/ul>", "k": "\\[x(t) = e^{-\\lambda t}\\left(A\\cos\\omega t + B\\sin\\omega t\\right)\\]\\[\\omega = \\sqrt{\\omega_0^2 - \\lambda^2}\\]", "fig": "REGIMES", "piege": "Le poly écrit \\((A+Bt)\\,e^{\\omega_0 t}\\) pour le régime critique : il manque le signe moins, c’est \\(e^{-\\omega_0 t}\\)."}], "ondes": [{"t": "Décrire un signal périodique", "h": "<p>Un signal se répète identique à lui-même. On le décrit par son amplitude A, sa période T (s), sa fréquence f = 1/T (Hz) et sa célérité c (m/s).<\/p>", "k": "\\[f = \\frac1T\\]\\[\\lambda = c\\,T = \\frac cf\\]", "fig": "WAVE"}, {"t": "Onde progressive", "h": "<p>Une perturbation qui se déplace <b>sans transport de matière<\/b>, à la célérité c. Vers les x croissants : \\(s(x,t) = f(t - x/c)\\). Vers les x décroissants : \\(f(t + x/c)\\).<\/p>", "piege": "La célérité dépend du milieu, pas de la façon dont on agite la corde."}, {"t": "L’onde sinusoïdale (OPPM)", "h": "<p>Onde plane progressive monochromatique, le long de x croissants.<\/p>", "k": "\\[s(x,t) = A\\cos(\\omega t - kx + \\varphi)\\]\\[\\omega = 2\\pi f\\]\\[k = \\frac\\omega c = \\frac{2\\pi}{\\lambda}\\]"}, {"t": "Le déphasage", "h": "<p>Δφ = φ₂ − φ₁ = −ωΔt. Positif : s₂ en avance. Négatif : s₂ en retard.<\/p><ul><li>Δφ = 0 : <b>en phase<\/b>.<\/li><li>Δφ = π : <b>opposition de phase<\/b> (les ondes s’annulent).<\/li><li>Δφ = π/2 : <b>quadrature<\/b>.<\/li><\/ul>"}, {"t": "Ondes stationnaires", "h": "<p>Deux ondes identiques en sens contraires sur une corde fixée. Les <b>nœuds<\/b> ne bougent jamais, les <b>ventres<\/b> vibrent au maximum. Le temps et l’espace sont découplés.<\/p>", "k": "\\[s(x,t) = 2A\\sin(\\omega t)\\sin(kx)\\]", "piege": "Ce résultat suppose que l’onde réfléchie est de signe opposé (corde fixée en x = 0). La somme de deux cosinus de même signe donnerait 2A cos(ωt) cos(kx)."}, {"t": "Corde fixée aux deux bouts", "h": "<p>s(L, t) = 0 impose sin(kL) = 0. Seules certaines longueurs d’onde existent : ce sont les <b>modes propres<\/b>. Le premier est le fondamental, les suivants les harmoniques.<\/p>", "k": "\\[\\lambda_n = \\frac{2L}{n}\\]\\[f_n = n\\,\\frac{c}{2L}\\]", "fig": "MODES"}]}, "qcm": [{"id": "q0-maths", "ch": "maths", "q": "Le produit scalaire de deux vecteurs non nuls, colinéaires et de sens opposés est :", "opts": [["a", "strictement positif"], ["b", "nul"], ["c", "strictement négatif"]], "ans": "c", "expl": "L’angle vaut 180°, donc cos α = −1 et \\(\\vec U\\cdot\\vec V = -UV < 0\\).", "multi": false}, {"id": "q1-maths", "ch": "maths", "q": "Un vecteur de norme F fait un angle α avec l’axe <b>Oy<\/b>. Sa composante sur x vaut :", "opts": [["a", "\\(F\\cos\\alpha\\)"], ["b", "\\(F\\sin\\alpha\\)"], ["c", "\\(F\\tan\\alpha\\)"]], "ans": "b", "expl": "Le cos va sur l’axe collé à l’angle, ici y. Il reste le sin pour x.", "multi": false}, {"id": "q2-maths", "ch": "maths", "q": "La dérivée de \\(\\cos(\\omega t)\\) par rapport à t est :", "opts": [["a", "\\(\\sin(\\omega t)\\)"], ["b", "\\(-\\sin(\\omega t)\\)"], ["c", "\\(-\\omega\\sin(\\omega t)\\)"]], "ans": "c", "expl": "On multiplie par la dérivée de l’intérieur, ω.", "multi": false}, {"id": "q3-maths", "ch": "maths", "q": "Une primitive de \\(-g\\) (g constante) est :", "opts": [["a", "\\(-g\\,t + C\\)"], ["b", "\\(-\\frac{g t^2}{2} + C\\)"], ["c", "\\(0\\)"]], "ans": "a", "expl": "La primitive d’une constante a est a·t + C.", "multi": false}, {"id": "q4-cine", "ch": "cine", "q": "L’unité d’une accélération est :", "opts": [["a", "m·s⁻¹"], ["b", "m·s⁻²"], ["c", "kg·m·s⁻¹"], ["d", "N"]], "ans": "b", "expl": "Une vitesse (m·s⁻¹) divisée par un temps (s).", "multi": false}, {"id": "q5-cine", "ch": "cine", "q": "Pour \\(x(t) = 1{,}25\\,t^2 + 7\\) (TD1), la vitesse vaut :", "opts": [["a", "\\(1{,}25\\,t\\)"], ["b", "\\(2{,}5\\,t\\)"], ["c", "\\(2{,}5\\,t + 7\\)"]], "ans": "b", "expl": "On dérive : (1,25 t²)' = 2,5 t, et la constante 7 disparaît.", "multi": false}, {"id": "q6-cine", "ch": "cine", "q": "Pour \\(x(t) = 1{,}25\\,t^2 + 7\\), à quel instant la vitesse atteint-elle 10 m/s ?", "opts": [["a", "2 s"], ["b", "4 s"], ["c", "8 s"]], "ans": "b", "expl": "2,5 t = 10 donne t = 4 s.", "multi": false}, {"id": "q7-cine", "ch": "cine", "q": "Si v·a > 0, le mouvement est :", "opts": [["a", "accéléré"], ["b", "décéléré"], ["c", "uniforme"]], "ans": "a", "expl": "Vitesse et accélération vont dans le même sens : la vitesse augmente.", "multi": false}, {"id": "q8-cine", "ch": "cine", "q": "Lors d’un mouvement rectiligne uniforme, l’accélération est :", "opts": [["a", "nulle"], ["b", "constante et non nulle"], ["c", "dirigée vers le centre"]], "ans": "a", "expl": "Ni la direction ni la valeur de la vitesse ne changent.", "multi": false}, {"id": "q9-cine", "ch": "cine", "q": "x(t) = 0,5 t et y(t) = −5 t² (caillou du TD1). Sur l’axe x, le mouvement est :", "opts": [["a", "uniforme"], ["b", "accéléré"], ["c", "immobile"]], "ans": "a", "expl": "\\(v_x = 0{,}5\\) m/s est constante.", "multi": false}, {"id": "q10-cine", "ch": "cine", "q": "La vitesse d’un point est toujours :", "opts": [["a", "perpendiculaire à la trajectoire"], ["b", "tangente à la trajectoire"], ["c", "dirigée vers l’origine"]], "ans": "b", "expl": "Elle est colinéaire au déplacement élémentaire dOM.", "multi": false}, {"id": "q11-cine", "ch": "cine", "q": "Pour trouver l’équation de la trajectoire, on doit :", "opts": [["a", "dériver x et y"], ["b", "éliminer le temps t"], ["c", "calculer la norme de la vitesse"]], "ans": "b", "expl": "La trajectoire y(x) ne contient plus t.", "multi": false}, {"id": "q12-forces", "ch": "forces", "q": "Le principe fondamental de la dynamique s’écrit :", "opts": [["a", "\\(\\sum\\vec F = m\\,\\V\\)"], ["b", "\\(\\sum\\vec F = m\\,\\A\\)"], ["c", "\\(\\sum\\vec F = \\vec 0\\) toujours"]], "ans": "b", "expl": "La somme des forces est égale à dp/dt = m a (masse constante).", "multi": false}, {"id": "q13-forces", "ch": "forces", "q": "Le principe d’inertie dit qu’un point sans interaction :", "opts": [["a", "s’arrête toujours"], ["b", "reste au repos ou en mouvement rectiligne uniforme"], ["c", "tombe"]], "ans": "b", "expl": "C’est la 1re loi de Newton, dans un référentiel galiléen.", "multi": false}, {"id": "q14-forces", "ch": "forces", "q": "La réaction d’un support est toujours :", "opts": [["a", "verticale"], ["b", "perpendiculaire au support"], ["c", "égale au poids"]], "ans": "b", "expl": "Sur une pente, elle n’est ni verticale ni égale au poids : R = mg cos α.", "multi": false}, {"id": "q15-forces", "ch": "forces", "q": "Un robot immobile sur une pente d’angle α. La norme du frottement vaut :", "opts": [["a", "\\(mg\\cos\\alpha\\)"], ["b", "\\(mg\\sin\\alpha\\)"], ["c", "\\(mg\\)"]], "ans": "b", "expl": "Le frottement compense la composante du poids le long de la pente (TD2).", "multi": false}, {"id": "q16-forces", "ch": "forces", "q": "Dans \\(\\vec f = -\\alpha\\V\\), l’unité de α est :", "opts": [["a", "kg·s⁻¹"], ["b", "N"], ["c", "s⁻¹"]], "ans": "a", "expl": "N divisé par m·s⁻¹ donne kg·s⁻¹.", "multi": false}, {"id": "q17-forces", "ch": "forces", "q": "La force gravitationnelle entre deux masses est :", "opts": [["a", "toujours attractive"], ["b", "toujours répulsive"], ["c", "attractive ou répulsive"]], "ans": "a", "expl": "Contrairement à la force de Coulomb, car une masse n’est jamais négative.", "multi": false}, {"id": "q18-forces", "ch": "forces", "q": "Choisis les affirmations justes :", "opts": [["a", "Le newton vaut kg·m·s⁻²"], ["b", "La quantité de mouvement vaut m·v"], ["c", "La tension d’un fil a une formule générale"], ["d", "Action-réaction : F₂→₁ = −F₁→₂"]], "ans": "a,b,d", "expl": "La tension n’a pas de formule générale : on la trouve avec le PFD.", "multi": true}, {"id": "q19-dyn", "ch": "dyn", "q": "En chute libre sans frottement, l’accélération :", "opts": [["a", "dépend de la masse"], ["b", "vaut g, quelle que soit la masse"], ["c", "est nulle"]], "ans": "b", "expl": "−mg = ma donne a = −g : la masse se simplifie.", "multi": false}, {"id": "q20-dyn", "ch": "dyn", "q": "Un objet lâché sans vitesse de 5 m de haut (g ≈ 10) touche le sol après environ :", "opts": [["a", "0,5 s"], ["b", "1 s"], ["c", "2 s"]], "ans": "b", "expl": "\\(T = \\sqrt{2y_0/g} = \\sqrt{10/10} = 1\\) s.", "multi": false}, {"id": "q21-dyn", "ch": "dyn", "q": "Au sommet de la trajectoire d’un projectile :", "opts": [["a", "la vitesse est nulle"], ["b", "la vitesse verticale est nulle"], ["c", "l’accélération est nulle"]], "ans": "b", "expl": "La vitesse horizontale v₀ cos α ne change pas, l’accélération vaut toujours g.", "multi": false}, {"id": "q22-dyn", "ch": "dyn", "q": "La trajectoire d’un projectile sans frottement est :", "opts": [["a", "une droite"], ["b", "un cercle"], ["c", "une parabole"]], "ans": "c", "expl": "\\(y(x) = -\\frac{g x^2}{2v_0^2\\cos^2\\alpha} + x\\tan\\alpha\\).", "multi": false}, {"id": "q23-dyn", "ch": "dyn", "q": "Pour \\(\\frac{dv}{dt} + \\frac v\\tau = -g\\), τ vaut :", "opts": [["a", "\\(\\frac\\alpha m\\)"], ["b", "\\(\\frac m\\alpha\\)"], ["c", "\\(m\\alpha\\)"]], "ans": "b", "expl": "On divise m dv/dt = −mg − αv par m.", "multi": false}, {"id": "q24-dyn", "ch": "dyn", "q": "Avec frottement fluide, la vitesse limite atteinte en chute vaut :", "opts": [["a", "gτ"], ["b", "g/τ"], ["c", "elle augmente sans fin"]], "ans": "a", "expl": "Quand t est grand, l’exponentielle tend vers 0 et |v| → gτ.", "multi": false}, {"id": "q25-dyn", "ch": "dyn", "q": "L’équation dv/dt + v/τ = −g est une équation différentielle :", "opts": [["a", "du 1er ordre"], ["b", "du 2e ordre"], ["c", "sans solution"]], "ans": "a", "expl": "Seule la dérivée première de v apparaît.", "multi": false}, {"id": "q26-energie", "ch": "energie", "q": "Le travail d’une force perpendiculaire au déplacement est :", "opts": [["a", "positif"], ["b", "nul"], ["c", "négatif"]], "ans": "b", "expl": "cos 90° = 0. C’est le cas de la réaction du support.", "multi": false}, {"id": "q27-energie", "ch": "energie", "q": "Le travail du poids quand un objet descend est :", "opts": [["a", "moteur"], ["b", "nul"], ["c", "résistant"]], "ans": "a", "expl": "\\(W = mg(z_A - z_B) > 0\\) quand \\(z_B < z_A\\).", "multi": false}, {"id": "q28-energie", "ch": "energie", "q": "Le théorème de l’énergie cinétique s’écrit :", "opts": [["a", "\\(\\sum W = \\Delta E_c\\)"], ["b", "\\(\\sum W = E_c\\)"], ["c", "\\(\\sum W = \\Delta E_p\\)"]], "ans": "a", "expl": "La somme des travaux est égale à la variation d’énergie cinétique.", "multi": false}, {"id": "q29-energie", "ch": "energie", "q": "Une balle tombe d’une hauteur H sans frottement. Sa vitesse au sol vaut :", "opts": [["a", "\\(\\sqrt{gH}\\)"], ["b", "\\(\\sqrt{2gH}\\)"], ["c", "\\(2gH\\)"]], "ans": "b", "expl": "mgH = ½mv².", "multi": false}, {"id": "q30-energie", "ch": "energie", "q": "L’énergie mécanique se conserve si :", "opts": [["a", "les frottements sont négligeables"], ["b", "la vitesse est constante"], ["c", "toujours"]], "ans": "a", "expl": "Les frottements dissipent l’énergie mécanique.", "multi": false}, {"id": "q31-energie", "ch": "energie", "q": "La puissance d’une force s’écrit :", "opts": [["a", "\\(P = \\vec F\\cdot\\V\\)"], ["b", "\\(P = F\\cdot AB\\)"], ["c", "\\(P = \\frac12 mv^2\\)"]], "ans": "a", "expl": "P = dW/dt = F · dl/dt = F · v. Unité : watt.", "multi": false}, {"id": "q32-energie", "ch": "energie", "q": "Un enfant tire un jouet avec T = 10 N à 40° de l’horizontale sur 5 m. Le travail vaut environ :", "opts": [["a", "50 J"], ["b", "38 J"], ["c", "32 J"]], "ans": "b", "expl": "W = 10 × 5 × cos 40° ≈ 38,3 J (TD4).", "multi": false}, {"id": "q33-energie", "ch": "energie", "q": "L’énergie potentielle élastique d’un ressort vaut :", "opts": [["a", "½ k x"], ["b", "½ k x²"], ["c", "k x²"]], "ans": "b", "expl": "Epe = ½ k x², avec x l’allongement.", "multi": false}, {"id": "q34-polaires", "ch": "polaires", "q": "En coordonnées polaires, le vecteur position s’écrit :", "opts": [["a", "\\(r\\,\\vec u_r + \\theta\\,\\vec u_\\theta\\)"], ["b", "\\(r\\,\\vec u_r\\)"], ["c", "\\(\\theta\\,\\vec u_r\\)"]], "ans": "b", "expl": "Un seul terme : θ est un angle, pas une longueur.", "multi": false}, {"id": "q35-polaires", "ch": "polaires", "q": "En coordonnées polaires, la vitesse s’écrit :", "opts": [["a", "\\(r\\,\\vec u_r + r\\dot\\theta\\,\\vec u_\\theta\\)"], ["b", "\\(\\dot r\\,\\vec u_r + r\\dot\\theta\\,\\vec u_\\theta\\)"], ["c", "\\(\\dot r\\,\\vec u_r + r\\ddot\\theta\\,\\vec u_\\theta\\)"]], "ans": "b", "expl": "On dérive le produit r·u_r, avec \\(\\frac{d\\vec u_r}{dt} = \\dot\\theta\\,\\vec u_\\theta\\).", "multi": false}, {"id": "q36-polaires", "ch": "polaires", "q": "\\(\\frac{d\\vec u_r}{dt}\\) vaut :", "opts": [["a", "\\(\\vec 0\\)"], ["b", "\\(\\dot\\theta\\,\\vec u_\\theta\\)"], ["c", "\\(-\\dot\\theta\\,\\vec u_\\theta\\)"], ["d", "\\(\\dot\\theta\\,\\vec u_r\\)"]], "ans": "b", "expl": "On tourne de +90° et on multiplie par θ̇.", "multi": false}, {"id": "q37-polaires", "ch": "polaires", "q": "\\(\\vec u_\\theta\\) s’écrit dans la base cartésienne :", "opts": [["a", "\\(\\cos\\theta\\,\\vec u_x + \\sin\\theta\\,\\vec u_y\\)"], ["b", "\\(-\\sin\\theta\\,\\vec u_x + \\cos\\theta\\,\\vec u_y\\)"], ["c", "\\(\\sin\\theta\\,\\vec u_x - \\cos\\theta\\,\\vec u_y\\)"]], "ans": "b", "expl": "C’est \\(\\ur\\) tourné de +90°.", "multi": false}, {"id": "q38-polaires", "ch": "polaires", "q": "Pour un mouvement circulaire uniforme de rayon R, l’accélération vaut :", "opts": [["a", "\\(\\vec 0\\)"], ["b", "\\(-R\\omega^2\\,\\vec u_r\\)"], ["c", "\\(R\\omega^2\\,\\vec u_\\theta\\)"]], "ans": "b", "expl": "Elle est centripète : dirigée vers le centre.", "multi": false}, {"id": "q39-polaires", "ch": "polaires", "q": "Un manège : \\(x = r_0\\cos\\omega t\\), \\(y = r_0\\sin\\omega t\\). La norme de la vitesse vaut :", "opts": [["a", "\\(r_0\\)"], ["b", "\\(r_0\\,\\omega\\)"], ["c", "\\(r_0\\,\\omega^2\\)"]], "ans": "b", "expl": "r = r₀ constant et \\(\\dot\\theta = \\omega\\), donc \\(\\V = r_0\\omega\\,\\vec u_\\theta\\) (TD5).", "multi": false}, {"id": "q40-polaires", "ch": "polaires", "q": "Le système de coordonnées polaires est surtout adapté aux mouvements :", "opts": [["a", "rectilignes"], ["b", "circulaires"], ["c", "paraboliques"]], "ans": "b", "expl": "Sur un cercle, r est constant : les calculs se simplifient.", "multi": false}, {"id": "q41-polaires", "ch": "polaires", "q": "Pour un satellite en orbite circulaire, sa vitesse vaut :", "opts": [["a", "\\(\\sqrt{GM_T\\,r}\\)"], ["b", "\\(\\sqrt{\\frac{GM_T}{r}}\\)"], ["c", "\\(\\frac{GM_T}{r^2}\\)"]], "ans": "b", "expl": "PFD sur \\(\\vec u_r\\) : \\(\\frac{v^2}{r} = \\frac{GM_T}{r^2}\\).", "multi": false}, {"id": "q42-osc", "ch": "osc", "q": "La force de rappel d’un ressort s’écrit :", "opts": [["a", "\\(-k\\,\\Delta l\\,\\vec u_x\\)"], ["b", "\\(k\\,l_0\\,\\vec u_x\\)"], ["c", "\\(-k\\,l\\,\\vec u_x\\)"]], "ans": "a", "expl": "Elle est proportionnelle à l’allongement Δl = l − l₀, pas à la longueur.", "multi": false}, {"id": "q43-osc", "ch": "osc", "q": "La pulsation propre d’un système masse-ressort vaut :", "opts": [["a", "\\(\\sqrt{\\frac mk}\\)"], ["b", "\\(\\sqrt{\\frac km}\\)"], ["c", "\\(\\frac km\\)"]], "ans": "b", "expl": "\\(\\ddot x + \\frac km x = 0\\), donc \\(\\omega_0^2 = \\frac km\\).", "multi": false}, {"id": "q44-osc", "ch": "osc", "q": "La période propre d’un système masse-ressort vaut :", "opts": [["a", "\\(2\\pi\\sqrt{\\frac mk}\\)"], ["b", "\\(2\\pi\\sqrt{\\frac km}\\)"], ["c", "\\(\\frac{2\\pi}{m}\\)"]], "ans": "a", "expl": "\\(T_0 = \\frac{2\\pi}{\\omega_0}\\).", "multi": false}, {"id": "q45-osc", "ch": "osc", "q": "Si on multiplie la masse par 4, la période :", "opts": [["a", "est multipliée par 4"], ["b", "est multipliée par 2"], ["c", "ne change pas"]], "ans": "b", "expl": "\\(T_0 \\propto \\sqrt m\\), et √4 = 2.", "multi": false}, {"id": "q46-osc", "ch": "osc", "q": "On lâche un ressort sans vitesse depuis x₀. La solution est :", "opts": [["a", "\\(x_0\\cos(\\omega_0 t)\\)"], ["b", "\\(x_0\\sin(\\omega_0 t)\\)"], ["c", "\\(\\frac{x_0}{\\omega_0}\\cos(\\omega_0 t)\\)"]], "ans": "a", "expl": "x(0) = x₀ donne A = x₀, et v(0) = 0 donne B = 0.", "multi": false}, {"id": "q47-osc", "ch": "osc", "q": "L’énergie cinétique d’un oscillateur est maximale :", "opts": [["a", "aux extrémités"], ["b", "au passage à la position d’équilibre"], ["c", "jamais"]], "ans": "b", "expl": "À x = 0, Epe = 0 et toute l’énergie est cinétique.", "multi": false}, {"id": "q48-osc", "ch": "osc", "q": "L’énergie mécanique d’un oscillateur harmonique vaut :", "opts": [["a", "½ k A²"], ["b", "½ m A²"], ["c", "k A"]], "ans": "a", "expl": "Elle est constante et proportionnelle au carré de l’amplitude.", "multi": false}, {"id": "q49-pendule", "ch": "pendule", "q": "Pour les petits angles, la période d’un pendule simple vaut :", "opts": [["a", "\\(2\\pi\\sqrt{\\frac gl}\\)"], ["b", "\\(2\\pi\\sqrt{\\frac lg}\\)"], ["c", "\\(2\\pi\\sqrt{\\frac ml}\\)"]], "ans": "b", "expl": "\\(\\omega_0 = \\sqrt{g/l}\\) et \\(T_0 = 2\\pi/\\omega_0\\).", "multi": false}, {"id": "q50-pendule", "ch": "pendule", "q": "La période d’un pendule simple :", "opts": [["a", "dépend de la masse"], ["b", "ne dépend pas de la masse"], ["c", "dépend de l’angle de départ, même petit"]], "ans": "b", "expl": "La masse se simplifie dans ml θ̈ = −mg sin θ.", "multi": false}, {"id": "q51-pendule", "ch": "pendule", "q": "L’approximation des petits angles consiste à écrire :", "opts": [["a", "sin θ ≈ θ"], ["b", "cos θ ≈ θ"], ["c", "sin θ ≈ 1"]], "ans": "a", "expl": "Valable pour θ en radians, petit.", "multi": false}, {"id": "q52-pendule", "ch": "pendule", "q": "L’énergie potentielle de pesanteur d’un pendule (origine en bas) vaut :", "opts": [["a", "m g l cos θ"], ["b", "m g l (1 − cos θ)"], ["c", "½ m l² θ̇²"]], "ans": "b", "expl": "La hauteur au-dessus du point le plus bas est l(1 − cos θ).", "multi": false}, {"id": "q53-pendule", "ch": "pendule", "q": "Le régime pseudo-périodique correspond à :", "opts": [["a", "λ < ω₀"], ["b", "λ = ω₀"], ["c", "λ > ω₀"]], "ans": "a", "expl": "Frottement faible : on garde des oscillations qui s’amortissent.", "multi": false}, {"id": "q54-pendule", "ch": "pendule", "q": "Le retour à l’équilibre le plus rapide a lieu en régime :", "opts": [["a", "pseudo-périodique"], ["b", "critique"], ["c", "apériodique"]], "ans": "b", "expl": "λ = ω₀.", "multi": false}, {"id": "q55-ondes", "ch": "ondes", "q": "La longueur d’onde vaut :", "opts": [["a", "λ = c · f"], ["b", "λ = c / f"], ["c", "λ = f / c"]], "ans": "b", "expl": "λ = c · T = c / f.", "multi": false}, {"id": "q56-ondes", "ch": "ondes", "q": "Une onde progressive transporte :", "opts": [["a", "de la matière"], ["b", "une perturbation, sans transport de matière"], ["c", "rien"]], "ans": "b", "expl": "Les points du milieu oscillent sur place.", "multi": false}, {"id": "q57-ondes", "ch": "ondes", "q": "Deux signaux en opposition de phase ont un déphasage de :", "opts": [["a", "0"], ["b", "π/2"], ["c", "π"]], "ans": "c", "expl": "Ils s’annulent s’ils ont la même amplitude.", "multi": false}, {"id": "q58-ondes", "ch": "ondes", "q": "Les micro-ondes ont une fréquence de 2,45 GHz. Leur longueur d’onde vaut environ :", "opts": [["a", "12 cm"], ["b", "12 µm"], ["c", "12 m"]], "ans": "a", "expl": "λ = 3·10⁸ / 2,45·10⁹ ≈ 0,12 m (TD8).", "multi": false}, {"id": "q59-ondes", "ch": "ondes", "q": "Sur une corde fixée aux deux bouts, les longueurs d’onde possibles sont :", "opts": [["a", "λₙ = 2L/n"], ["b", "λₙ = L/n"], ["c", "λₙ = nL"]], "ans": "a", "expl": "sin(kL) = 0 donne kL = nπ.", "multi": false}, {"id": "q60-ondes", "ch": "ondes", "q": "Dans une onde stationnaire, un nœud est un point où l’amplitude est :", "opts": [["a", "maximale"], ["b", "nulle"], ["c", "égale à A"]], "ans": "b", "expl": "Les ventres sont les points d’amplitude maximale.", "multi": false}, {"id": "q61-ondes", "ch": "ondes", "q": "L’oreille humaine entend les sons entre :", "opts": [["a", "20 Hz et 20 kHz"], ["b", "2 Hz et 2 kHz"], ["c", "20 kHz et 200 kHz"]], "ans": "a", "expl": "En dessous : infrasons. Au-dessus : ultrasons.", "multi": false}, {"id": "q62-ondes", "ch": "ondes", "q": "La pulsation spatiale k d’une OPPM vaut :", "opts": [["a", "\\(\\frac\\omega c\\)"], ["b", "\\(\\omega c\\)"], ["c", "\\(\\frac c\\omega\\)"]], "ans": "a", "expl": "\\(k = \\frac\\omega c = \\frac{2\\pi}\\lambda\\).", "multi": false}], "exos": [{"id": "td1-voiture", "ch": "cine", "td": "TD1", "titre": "Mouvement d’une voiture", "tag": "À préparer", "niv": 1, "officiel": true, "enonce": "Une voiture démarre en ligne droite. Son abscisse vaut \\(x(t) = 1{,}25\\,t^2 + 7\\) (en mètres).", "etapes": [["À quelle distance du domicile la voiture était-elle garée ?", "Regarde t = 0.", "\\(x(0) = 7\\) m."], ["Exprime la vitesse, puis l’instant où elle atteint 10 m/s.", "Dérive x(t).", "\\(v(t) = 2{,}5\\,t\\). On résout 2,5 t = 10 : \\(t = 4\\) s."], ["Quelle distance a-t-elle parcourue alors ?", "Calcule x(4), puis retire la position de départ.", "\\(x(4) = 1{,}25\\times16 + 7 = 27\\) m. Elle a donc avancé de 20 m depuis sa place."], ["Calcule l’accélération.", "Dérive v(t).", "\\(a = 2{,}5\\) m·s⁻², constante."], ["Quelle accélération faut-il pour atteindre 10 m/s en 2 s ?", "v(t) = a·t quand on part de 0.", "\\(a = \\frac{10}{2} = 5\\) m·s⁻²."], ["Avec 5 m·s⁻² pendant 4 s : vitesse et position atteintes ?", "Intègre deux fois, avec x(0) = 7.", "\\(v(4) = 5\\times4 = 20\\) m/s et \\(x(4) = \\frac{5\\times4^2}{2} + 7 = 47\\) m."]]}, {"id": "td1-tgv", "ch": "cine", "td": "TD1", "titre": "TGV et formule 1", "tag": "En classe", "niv": 1, "officiel": true, "enonce": "Un TGV passe de 90 km/h à 320 km/h en 5 min 20 s. Une F1 passe de 0 à 180 km/h en 4 s. On prend g = 10 m·s⁻².", "etapes": [["Accélération moyenne du TGV ?", "Convertis en m/s (÷ 3,6), puis a = Δv/Δt.", "Δv = 230 km/h ≈ 64 m/s, Δt = 320 s, donc \\(a \\approx 0{,}2\\) m·s⁻²."], ["Exprime-la en « g ».", "Divise par 10.", "0,2 / 10 = 0,02 g : très faible, les passagers ne sentent presque rien."], ["Accélération de la F1 en « g » ?", "180 km/h = 50 m/s.", "\\(a = 50/4 = 12{,}5\\) m·s⁻², soit environ 1,25 g : environ 60 fois le TGV."]]}, {"id": "td1-parabole", "ch": "dyn", "td": "TD1", "titre": "Mouvement parabolique", "tag": "En classe", "niv": 2, "officiel": true, "enonce": "Un projectile part de (0, 0) avec une vitesse v₀ qui fait un angle α avec l’horizontale. \\(x(t) = v_0\\cos\\alpha\\,t\\) et \\(y(t) = v_0\\sin\\alpha\\,t - \\frac g2 t^2\\).", "etapes": [["Donne le cadre d’étude.", "Référentiel, système, coordonnées.", "Référentiel terrestre supposé galiléen, système : le projectile, coordonnées cartésiennes."], ["Établis l’équation de la trajectoire y(x).", "Isole t dans x(t).", "\\(t = \\frac{x}{v_0\\cos\\alpha}\\), donc \\(y(x) = x\\tan\\alpha - \\frac{g\\,x^2}{2v_0^2\\cos^2\\alpha}\\) : une parabole."], ["Vecteur vitesse et sa norme ?", "Dérive chaque coordonnée.", "\\(\\V = (v_0\\cos\\alpha\\ ;\\ v_0\\sin\\alpha - gt)\\) et \\(\\|\\V\\| = \\sqrt{v_0^2\\cos^2\\alpha + (v_0\\sin\\alpha - gt)^2}\\)."], ["Vecteur accélération et sa norme ?", "Dérive encore.", "\\(\\A = (0\\ ;\\ -g)\\), de norme g."], ["Nature du mouvement sur chaque axe ?", "Regarde v_x et le signe de v_y·a_y.", "Sur x : uniforme, dans le sens positif. Sur y : décéléré en montant, puis accéléré en descendant."], ["Calcule la portée x_max.", "Cherche quand y = 0 (autre que t = 0).", "\\(t = \\frac{2v_0\\sin\\alpha}{g}\\), donc \\(x_{max} = \\frac{2v_0^2\\sin\\alpha\\cos\\alpha}{g}\\)."], ["Coordonnées du sommet ?", "Au sommet, v_y = 0.", "\\(t_S = \\frac{v_0\\sin\\alpha}{g}\\), \\(x_S = \\frac{v_0^2\\sin\\alpha\\cos\\alpha}{g}\\), \\(y_S = \\frac{v_0^2\\sin^2\\alpha}{2g}\\)."]]}, {"id": "td1-puits", "ch": "cine", "td": "TD1", "titre": "Profondeur d’un puits", "tag": "Pour aller plus loin", "niv": 2, "officiel": true, "enonce": "Un caillou lancé horizontalement : \\(x(t) = 0{,}5\\,t\\) et \\(y(t) = -5\\,t^2\\) (en mètres). Il touche le fond du puits après 2,0 s.", "etapes": [["Calcule v_x(t) et v_y(t). Commente les signes.", "Dérive.", "\\(v_x = 0{,}5\\) m/s (vers la droite), \\(v_y = -10\\,t\\) (vers le bas)."], ["Le mouvement est-il rectiligne ? uniforme ?", "Regarde chaque composante.", "Ni l’un ni l’autre : uniforme sur x, accéléré vers le bas sur y. C’est un mouvement curviligne accéléré."], ["Calcule l’accélération. Le caillou est-il en chute libre ?", "Dérive v.", "\\(a_x = 0\\) et \\(a_y = -10\\) m·s⁻² = −g : oui, chute libre."], ["Quelle est la profondeur du puits ?", "Calcule y(2).", "\\(y(2) = -5\\times4 = -20\\) m : le puits fait 20 m."]]}, {"id": "td2-pente", "ch": "forces", "td": "TD2", "titre": "Robot immobile sur une pente", "tag": "En classe", "niv": 2, "officiel": true, "enonce": "Un robot de masse m reste immobile sur une pente d’angle α = 30°. Axe x le long de la pente, axe y perpendiculaire.", "fig": "INCLINE", "etapes": [["Quelles forces subit le robot ?", "Trois forces.", "Le poids \\(\\vec P\\) (vertical), la réaction \\(\\vec R\\) (perpendiculaire à la pente) et le frottement \\(\\vec f\\) (le long de la pente, vers le haut)."], ["Exprime le poids dans la base (x, y).", "Décompose P comme une force inclinée de α.", "\\(\\vec P = (mg\\sin\\alpha\\ ;\\ -mg\\cos\\alpha)\\)."], ["Avec le PFD, exprime R et f.", "À l’équilibre, la somme des forces est nulle. Projette sur x puis sur y.", "Sur x : \\(mg\\sin\\alpha + f_x = 0\\), donc \\(f = mg\\sin\\alpha\\) vers le haut de la pente. Sur y : \\(R = mg\\cos\\alpha\\)."]]}, {"id": "td2-robot", "ch": "dyn", "td": "TD2", "titre": "Robot poussé par un moteur", "tag": "Pour aller plus loin", "niv": 2, "officiel": true, "enonce": "Robot de masse m = 10 kg, vitesse initiale 2 m/s, poussé par une force F = 50 N horizontale.", "etapes": [["Sans frottement : accélération ?", "PFD projeté sur x.", "\\(a = \\frac Fm = 5\\) m·s⁻²."], ["Expressions de v(t) et x(t) ?", "Intègre, avec v(0) = 2.", "\\(v = \\frac Fm t + 2\\) et \\(x = \\frac{F}{2m}t^2 + 2t\\)."], ["Distance parcourue en une minute ?", "t = 60 s.", "\\(x(60) = 2{,}5\\times3600 + 120 = 9120\\) m."], ["Avec \\(\\vec f = -\\alpha\\V\\), α = 0,5 S.I. : que signifie le signe − ? Unité de α ?", "Compare les unités de f et v.", "Le frottement s’oppose au mouvement. α est en kg·s⁻¹."], ["Vitesse maximale atteinte ?", "À vitesse max, a = 0 : les forces se compensent.", "\\(\\alpha v_{max} = F\\), donc \\(v_{max} = \\frac{50}{0{,}5} = 100\\) m/s."]]}, {"id": "td3-parachute", "ch": "dyn", "td": "TD3", "titre": "Chute d’un parachutiste", "tag": "À préparer + en classe", "niv": 2, "officiel": true, "enonce": "Parachutiste de masse m = 80 kg, sautant de 3000 m sans vitesse initiale. Axe y vers le haut.", "etapes": [["Sans frottement : accélération, vitesse, position ?", "PFD, puis deux intégrations.", "\\(a = -g\\), \\(v = -gt\\), \\(y = -\\frac{gt^2}{2} + 3000\\)."], ["Durée de la chute et vitesse au sol ?", "y(T) = 0.", "\\(T = \\sqrt{\\frac{6000}{g}} \\approx 24{,}7\\) s et \\(|v| = gT \\approx 242\\) m/s : irréaliste, il manque l’air."], ["Avec \\(\\vec f = -\\alpha\\V\\) : écris l’équation sur v.", "PFD : −mg − αv = m dv/dt.", "\\(\\frac{dv}{dt} + \\frac v\\tau = -g\\) avec \\(\\tau = \\frac m\\alpha\\) : équation différentielle du 1er ordre."], ["Résous-la.", "Solution homogène + solution particulière constante.", "\\(v(t) = g\\tau\\left(e^{-t/\\tau} - 1\\right)\\)."], ["Que vaut la vitesse maximale ? Compare.", "Fais tendre t vers l’infini.", "\\(|v| \\to g\\tau\\). Le graphe donne environ 69,5 m/s, bien moins que 242 m/s : l’air freine."]]}, {"id": "td3-rugby", "ch": "dyn", "td": "TD3", "titre": "Pénalité au rugby", "tag": "En classe", "niv": 2, "officiel": true, "enonce": "Ballon (m = 420 g) botté à ‖v₀‖ = 23 m/s, angle β = 38°, à d = 40 m des poteaux. Barre transversale à 3 m. Pas de frottement.", "etapes": [["PFD : accélération ?", "Seule force : le poids.", "\\(\\A = (0\\ ;\\ -g)\\)."], ["Vitesse et position ?", "Intègre avec les conditions initiales.", "\\[\\V = \\begin{pmatrix} v_0\\cos\\beta \\\\ -gt + v_0\\sin\\beta \\end{pmatrix}\\]\\[\\OM = \\begin{pmatrix} v_0\\cos\\beta\\,t \\\\ -\\frac{gt^2}{2} + v_0\\sin\\beta\\,t \\end{pmatrix}\\]"], ["Équation de la trajectoire ?", "Élimine t.", "\\(y(x) = -\\frac{g\\,x^2}{2v_0^2\\cos^2\\beta} + x\\tan\\beta\\) : une parabole."], ["Le but est-il marqué ?", "Calcule y(40) et compare à 3 m.", "\\(y(40) \\approx 7{,}4\\) m &gt; 3 m : oui, le but est marqué."]]}, {"id": "td4-chute", "ch": "energie", "td": "TD4", "titre": "Chute libre par l’énergie", "tag": "À préparer", "niv": 1, "officiel": false, "enonce": "Une balle de masse m est lâchée sans vitesse d’une hauteur h. On néglige les frottements.", "etapes": [["Ec et Ep au départ et au sol ?", "Ep = mgh, Ec = ½mv².", "Départ : \\(E_c = 0\\), \\(E_p = mgh\\). Sol : \\(E_c = \\frac12 mv_{sol}^2\\), \\(E_p = 0\\)."], ["Avec l’énergie mécanique, trouve v_sol. Pourquoi a-t-on le droit ?", "Seul le poids agit, et il est conservatif.", "\\(mgh = \\frac12 mv_{sol}^2\\), donc \\(v_{sol} = \\sqrt{2gh}\\)."], ["Retrouve-le avec le TEC.", "Travail du poids sur une descente de h.", "\\(W(\\vec P) = mgh = \\frac12 mv_{sol}^2 - 0\\) : même résultat."]]}, {"id": "td4-travail", "ch": "energie", "td": "TD4", "titre": "Travail d’une force", "tag": "En classe", "niv": 1, "officiel": false, "enonce": "(1) Force F = 3 N à 30° du déplacement AB = 50 cm. (2) Le poids d’un ballon de 500 g fournit un travail de 5,4 J. (3) Traction T = 10 N à 40° sur 5,0 m.", "fig": "WORK", "etapes": [["(1) Travail de F ?", "W = F · AB · cos θ.", "\\(W = 3\\times0{,}5\\times\\cos30° \\approx 1{,}3\\) J (moteur)."], ["(2) Le ballon monte-t-il ou descend-il ? De combien ?", "\\(W = mg(z_A - z_B)\\).", "W &gt; 0 : il descend. \\(\\Delta z = \\frac{5{,}4}{0{,}5\\times9{,}81} \\approx 1{,}1\\) m."], ["(3) Travail de la traction ?", "Même formule.", "\\(W = 10\\times5\\times\\cos40° \\approx 38\\) J."]]}, {"id": "td4-robot", "ch": "energie", "td": "TD4", "titre": "Robot sur un parcours incliné", "tag": "En classe", "niv": 2, "officiel": false, "enonce": "m = 100 kg, poussée F = 250 N, frottement f = 50 N, g = 10. Départ de A sans vitesse. AB horizontal (10 m), puis montée BC de pente 30° jusqu’à C, 20 m plus haut que AB.", "etapes": [["Sur AB, quelles forces travaillent ? Vitesse en B ?", "P et R sont perpendiculaires au déplacement. TEC.", "F (moteur) et f (résistant). \\(\\frac12 mv_B^2 = (F - f)\\times AB = 2000\\) J, donc \\(v_B \\approx 6{,}3\\) m/s."], ["Sur BC, forces motrices et résistantes ?", "Pense au poids qui monte.", "Motrice : F. Résistantes : f et le poids (le robot monte). R ne travaille pas."], ["Le moteur suffit-il pour atteindre C ?", "BC = 20 / sin 30° = 40 m. Écris le TEC entre B et C.", "\\[\\tfrac12 mv_C^2 = 2000 + 200\\times40 - 100\\times10\\times20\\]\\[\\tfrac12 mv_C^2 = -10\\,000\\ \\text{J} < 0\\]<p>Impossible : le moteur n’est pas assez puissant. Il faudrait F ≥ 500 N.<\/p>"]]}, {"id": "td4-arc", "ch": "energie", "td": "TD4", "titre": "Arc de cercle puis frottement", "tag": "Pour aller plus loin", "niv": 2, "officiel": false, "enonce": "m = 0,10 kg, R = 1,6 m, θ = 60°, v_A = v_C = 3,0 m/s, BC = 2,0 m, g = 10. AB : arc sans frottement. BC : frottement de norme constante f.", "etapes": [["Sur AB, comment évoluent Ec, Ep et Em ?", "Le solide descend, sans frottement.", "Ep diminue, Ec augmente, Em reste constante."], ["Montre que h = R(1 − cos θ) et calcule v_B.", "Conservation de Em.", "<p>h = R(1 − cos θ) = 0,8 m. Puis :<\/p>\\[v_B = \\sqrt{v_A^2 + 2gR(1 - \\cos\\theta)} = \\sqrt{9 + 16} = 5\\ \\text{m/s}\\]"], ["Calcule f sur BC.", "TEC entre B et C.", "\\(\\frac12 m(v_C^2 - v_B^2) = -f\\cdot BC\\), donc \\(f = \\frac{0{,}1\\times(25 - 9)}{2\\times2} = 0{,}4\\) N."]]}, {"id": "td5-base", "ch": "polaires", "td": "TD5", "titre": "La base polaire", "tag": "À préparer", "niv": 1, "officiel": false, "enonce": "Point M repéré par (r, θ).", "fig": "POLAR", "etapes": [["Vecteur position dans la base polaire ?", "Un seul terme.", "\\(\\OM = r\\,\\ur\\)."], ["Retrouve la vitesse.", "v = dOM/dt, et \\(\\frac{d\\ur}{dt} = \\dot\\theta\\,\\ut\\).", "\\(\\V = \\dot r\\,\\ur + r\\dot\\theta\\,\\ut\\)."], ["Retrouve l’accélération.", "Dérive chaque terme, avec \\(\\frac{d\\ut}{dt} = -\\dot\\theta\\,\\ur\\).", "\\(\\A = (\\ddot r - r\\dot\\theta^2)\\,\\ur + (2\\dot r\\dot\\theta + r\\ddot\\theta)\\,\\ut\\)."]]}, {"id": "td5-manege", "ch": "polaires", "td": "TD5", "titre": "Mouvement d’un manège", "tag": "En classe", "niv": 2, "officiel": false, "enonce": "\\(x(t) = r_0\\cos(\\omega t)\\) et \\(y(t) = r_0\\sin(\\omega t)\\).", "etapes": [["Unités de r₀ et ω ?", "x est une longueur, ωt un angle.", "r₀ en mètres, ω en rad/s."], ["Vecteur position en polaires ?", "Reconnais r et θ.", "r = r₀ et θ = ωt, donc \\(\\OM = r_0\\,\\ur\\)."], ["Vecteur vitesse et sa norme ?", "r est constant.", "\\(\\V = r_0\\omega\\,\\ut\\), de norme \\(r_0\\omega\\) (m·rad/s = m/s, homogène)."], ["En cartésiennes, retrouve la norme et le lien entre ω et θ̇.", "Dérive x et y (l’énoncé oublie un ω).", "\\(\\V = -r_0\\omega\\sin\\omega t\\,\\vec u_x + r_0\\omega\\cos\\omega t\\,\\vec u_y\\), norme \\(r_0\\omega\\), donc \\(\\dot\\theta = \\omega\\)."], ["Nature du mouvement et accélération ?", "r constant, ω constant.", "Circulaire uniforme. \\(\\A = -r_0\\omega^2\\,\\ur\\), de norme \\(r_0\\omega^2\\), dirigée vers le centre."]]}, {"id": "td5-satellite", "ch": "polaires", "td": "TD5", "titre": "Satellite en orbite", "tag": "Pour aller plus loin", "niv": 3, "officiel": false, "enonce": "Satellite de 300 kg à h = 6400 km du sol, R_T = 6400 km, \\(G = 6{,}67\\cdot10^{-11}\\), \\(M_T = 6\\cdot10^{24}\\) kg.", "etapes": [["Position, vitesse et accélération en polaires (r constant) ?", "ṙ = 0.", "\\(\\OM = r\\,\\ur\\), \\(\\V = r\\dot\\theta\\,\\ut\\), \\(\\A = -r\\dot\\theta^2\\,\\ur + r\\ddot\\theta\\,\\ut\\)."], ["Force et PFD ?", "Gravitation vers le centre.", "\\(\\vec F = -\\frac{GmM_T}{r^2}\\,\\ur\\), donc \\(\\A = -\\frac{GM_T}{r^2}\\,\\ur\\)."], ["Montre que θ̇ est constant et que a = v²/r.", "Compare les composantes.", "Sur \\(\\ut\\) : \\(r\\ddot\\theta = 0\\). Sur \\(\\ur\\) : \\(a = r\\omega^2 = \\frac{v^2}{r}\\)."], ["Calcule v et la période.", "r = R_T + h = 12 800 km.", "\\(v = \\sqrt{\\frac{GM_T}{r}} \\approx 5{,}6\\) km/s et \\(T = \\frac{2\\pi r}{v} \\approx 1{,}44\\cdot10^4\\) s ≈ 4 h."]]}, {"id": "td6-vertical", "ch": "osc", "td": "TD6", "titre": "Ressort vertical", "tag": "En classe", "niv": 2, "officiel": false, "enonce": "Balle de masse m, ressort (k, ℓ₀) accroché en O. Axe z <b>vers le haut<\/b>, donc M est en z &lt; 0 et le ressort mesure −z. Lâchée sans vitesse quand le ressort mesure 3ℓ₀/2.", "etapes": [["Forces sur la balle ?", "Le ressort étiré tire vers O.", "\\(\\vec P = -mg\\,\\vec u_z\\) et \\(\\vec F = k(-z - \\ell_0)\\,\\vec u_z\\)."], ["Position d’équilibre z_e ?", "Somme des forces nulle.", "\\(-mg + k(-z_e - \\ell_0) = 0\\), donc \\(z_e = -\\left(\\ell_0 + \\frac{mg}{k}\\right)\\)."], ["Équation différentielle sous la forme z̈ + a ż + b z = c ?", "PFD projeté sur z.", "\\(\\ddot z + \\frac km z = -g - \\frac{k\\ell_0}{m}\\) : a = 0, b = k/m, c = −(g + kℓ₀/m)."], ["Avec Z = z − z_e, montre que Z̈ + ω₀²Z = 0.", "Remplace z par Z + z_e.", "Le second membre disparaît : \\(\\ddot Z + \\omega_0^2 Z = 0\\), avec \\(\\omega_0 = \\sqrt{k/m}\\)."], ["Trouve z(t).", "Z(0) = −3ℓ₀/2 − z_e et Ż(0) = 0.", "\\(z(t) = z_e + \\left(-\\frac{3\\ell_0}{2} - z_e\\right)\\cos(\\omega_0 t)\\)."]]}, {"id": "td6-hcl", "ch": "osc", "td": "TD6", "titre": "Vibration de la molécule HCl", "tag": "Pour aller plus loin", "niv": 3, "officiel": false, "enonce": "f = 8,5·10¹³ Hz, \\(M_H = 1{,}0\\) g/mol, \\(N_A = 6{,}0\\cdot10^{23}\\), \\(E = \\frac{hf}{2}\\) avec \\(h = 6{,}62\\cdot10^{-34}\\) J·s.", "etapes": [["Pourquoi supposer le chlore fixe ?", "Compare les masses.", "Il est 35,5 fois plus lourd que l’hydrogène : il bouge très peu."], ["Calcule la raideur k.", "\\(k = m\\omega_0^2\\) avec \\(\\omega_0 = 2\\pi f\\) et \\(m = M_H/N_A\\).", "\\(m \\approx 1{,}67\\cdot10^{-27}\\) kg, donc \\(k \\approx 4{,}8\\cdot10^2\\) N/m."], ["Vitesse maximale de H ?", "Ec est maximale au passage à l’équilibre, où elle vaut E.", "\\(v_{max} = \\sqrt{2E/m} \\approx 5{,}8\\) km/s."], ["Amplitude du mouvement ?", "Epe est maximale aux extrémités, où elle vaut E.", "\\(A = \\sqrt{2E/k} \\approx 11\\) pm, environ 9 % de la liaison (127 pm)."]]}, {"id": "td7-pendule", "ch": "pendule", "td": "TD7", "titre": "Pendule simple", "tag": "En classe", "niv": 2, "officiel": false, "enonce": "Masse au bout d’un fil de longueur l, lâchée sans vitesse depuis θ₀.", "fig": "PENDULE", "etapes": [["Forces et PFD ?", "Poids et tension.", "\\(\\vec P + \\vec T = m\\A\\), avec \\(\\A = -l\\dot\\theta^2\\,\\ur + l\\ddot\\theta\\,\\ut\\)."], ["Projette sur les deux axes.", "\\(\\vec P = mg\\cos\\theta\\,\\ur - mg\\sin\\theta\\,\\ut\\) et \\(\\vec T = -T\\,\\ur\\).", "Sur \\(\\ut\\) : \\(ml\\ddot\\theta = -mg\\sin\\theta\\). Sur \\(\\ur\\) : \\(T = mg\\cos\\theta + ml\\dot\\theta^2\\)."], ["Forme canonique (petits angles) ?", "sin θ ≈ θ.", "\\(\\ddot\\theta + \\frac gl\\theta = 0\\), avec \\(\\omega_0 = \\sqrt{g/l}\\)."], ["Résous avec les conditions initiales.", "θ(0) = θ₀, θ̇(0) = 0.", "\\(\\theta(t) = \\theta_0\\cos(\\omega_0 t)\\)."]]}, {"id": "td7-energie", "ch": "pendule", "td": "TD7", "titre": "Pendule : étude énergétique", "tag": "En classe", "niv": 2, "officiel": false, "enonce": "Même pendule, sans frottement.", "etapes": [["Énergie potentielle ? Quand est-elle maximale ?", "Hauteur au-dessus du point bas : l(1 − cos θ).", "\\(E_p = mgl(1 - \\cos\\theta)\\) : maximale en ±θ₀, nulle en θ = 0."], ["Énergie cinétique ?", "v = l θ̇.", "\\(E_c = \\frac12 ml^2\\dot\\theta^2\\) : maximale en θ = 0, nulle aux extrémités."], ["Retrouve l’équation de l’oscillateur.", "Em est constante : dérive-la.", "\\(ml^2\\dot\\theta\\ddot\\theta + mgl\\sin\\theta\\,\\dot\\theta = 0\\), donc \\(\\ddot\\theta + \\frac gl\\sin\\theta = 0\\) ≈ \\(\\ddot\\theta + \\frac gl\\theta = 0\\)."]]}, {"id": "td8-microonde", "ch": "ondes", "td": "TD8", "titre": "Le four à micro-ondes", "tag": "En classe", "niv": 1, "officiel": false, "enonce": "Ondes de fréquence 2,45 GHz, c = 3·10⁸ m/s.", "etapes": [["Longueur d’onde ?", "λ = c / f.", "\\(\\lambda = \\frac{3\\cdot10^8}{2{,}45\\cdot10^9} \\approx 0{,}12\\) m = 12 cm."], ["Sont-elles micrométriques ? Quel domaine ?", "Compare à 10⁻⁶ m.", "Non, elles sont centimétriques. Ce sont des ondes radio de type hyperfréquences."], ["Des ondes stationnaires peuvent-elles exister ?", "La cavité est fermée par du métal.", "Oui : aux nœuds, les aliments chauffent mal. C’est pour ça que le plateau tourne."]]}, {"id": "td8-instrument", "ch": "ondes", "td": "TD8", "titre": "Instrument de musique", "tag": "Pour aller plus loin", "niv": 3, "officiel": false, "enonce": "Cavité de longueur L, fermée d’un côté, ouverte de l’autre : \\(L = \\frac{\\lambda_n}{4} + n\\frac{\\lambda_n}{2}\\). c = 340 m/s.", "etapes": [["Fréquences propres f_n ?", "Isole λ_n, puis f = c/λ.", "\\(\\lambda_n = \\frac{4L}{2n+1}\\), donc \\(f_n = (2n+1)\\frac{c}{4L}\\)."], ["L pour que la plus basse soit 440 Hz ?", "n = 0.", "\\(L = \\frac{c}{4f} = \\frac{340}{1760} \\approx 19\\) cm."], ["Fréquence suivante ?", "n = 1.", "\\(f = 3\\times440 = 1320\\) Hz."]]}], "fiches": [{"id": "f0-maths", "ch": "maths", "q": "Composantes d’un vecteur F à l’angle α de Ox ?", "r": "\\((F\\cos\\alpha\\ ;\\ F\\sin\\alpha)\\)"}, {"id": "f1-maths", "ch": "maths", "q": "Produit scalaire (deux formules) ?", "r": "\\(U_xV_x + U_yV_y = UV\\cos\\alpha\\)"}, {"id": "f2-maths", "ch": "maths", "q": "Identité trigo fondamentale ?", "r": "\\(\\cos^2x + \\sin^2x = 1\\)"}, {"id": "f3-cine", "ch": "cine", "q": "Vitesse en cartésiennes ?", "r": "\\(\\V = \\dot x\\,\\vec u_x + \\dot y\\,\\vec u_y\\)"}, {"id": "f4-cine", "ch": "cine", "q": "Accéléré ou décéléré : quel test ?", "r": "Signe de \\(\\V\\cdot\\A\\) : positif = accéléré, négatif = décéléré."}, {"id": "f5-cine", "ch": "cine", "q": "Comment trouver la trajectoire ?", "r": "Éliminer t entre x(t) et y(t)."}, {"id": "f6-forces", "ch": "forces", "q": "Le PFD ?", "r": "\\(\\sum\\vec F = \\frac{d\\vec p}{dt} = m\\A\\)"}, {"id": "f7-forces", "ch": "forces", "q": "Principe d’inertie ?", "r": "Sans interaction : repos ou mouvement rectiligne uniforme (référentiel galiléen)."}, {"id": "f8-forces", "ch": "forces", "q": "Action-réaction ?", "r": "\\(\\vec F_{2\\to1} = -\\vec F_{1\\to2}\\)"}, {"id": "f9-forces", "ch": "forces", "q": "Force de gravitation ?", "r": "\\(F = G\\frac{m_1m_2}{d^2}\\), toujours attractive"}, {"id": "f10-forces", "ch": "forces", "q": "Frottement fluide ?", "r": "\\(\\vec f = -\\alpha\\V\\), α en kg·s⁻¹"}, {"id": "f11-forces", "ch": "forces", "q": "Sur une pente à l’équilibre : R et f ?", "r": "\\(R = mg\\cos\\alpha\\), \\(f = mg\\sin\\alpha\\)"}, {"id": "f12-dyn", "ch": "dyn", "q": "Chute libre : a, v, y ?", "r": "\\(a = -g\\), \\(v = -gt\\), \\(y = -\\frac{gt^2}{2} + y_0\\)"}, {"id": "f13-dyn", "ch": "dyn", "q": "Sommet d’un tir : condition ?", "r": "\\(v_y = 0\\), donc \\(t_S = \\frac{v_0\\sin\\alpha}{g}\\)"}, {"id": "f14-dyn", "ch": "dyn", "q": "Frottement : équation sur v et τ ?", "r": "\\(\\frac{dv}{dt} + \\frac v\\tau = -g\\), \\(\\tau = \\frac m\\alpha\\)"}, {"id": "f15-dyn", "ch": "dyn", "q": "Vitesse limite avec frottement ?", "r": "\\(v_{lim} = g\\tau = \\frac{mg}{\\alpha}\\)"}, {"id": "f16-energie", "ch": "energie", "q": "Travail d’une force constante ?", "r": "\\(W = F\\cdot AB\\cos\\theta\\)"}, {"id": "f17-energie", "ch": "energie", "q": "Travail du poids ?", "r": "\\(W = mg(z_A - z_B)\\)"}, {"id": "f18-energie", "ch": "energie", "q": "Théorème de l’énergie cinétique ?", "r": "\\(\\sum W = \\frac12mv_B^2 - \\frac12mv_A^2\\)"}, {"id": "f19-energie", "ch": "energie", "q": "Énergie mécanique ?", "r": "\\(E_M = E_c + E_p\\), constante sans frottement"}, {"id": "f20-energie", "ch": "energie", "q": "Puissance ?", "r": "\\(P = \\vec F\\cdot\\V\\), en watts"}, {"id": "f21-energie", "ch": "energie", "q": "Vitesse après une chute de H ?", "r": "\\(v = \\sqrt{2gH}\\)"}, {"id": "f22-polaires", "ch": "polaires", "q": "Base polaire en cartésiennes ?", "r": "\\(\\ur = (\\cos\\theta ; \\sin\\theta)\\), \\(\\ut = (-\\sin\\theta ; \\cos\\theta)\\)"}, {"id": "f23-polaires", "ch": "polaires", "q": "Dérivées de la base polaire ?", "r": "\\(\\frac{d\\ur}{dt} = \\dot\\theta\\,\\ut\\), \\(\\frac{d\\ut}{dt} = -\\dot\\theta\\,\\ur\\)"}, {"id": "f24-polaires", "ch": "polaires", "q": "Vitesse en polaires ?", "r": "\\(\\V = \\dot r\\,\\ur + r\\dot\\theta\\,\\ut\\)"}, {"id": "f25-polaires", "ch": "polaires", "q": "Accélération en polaires ?", "r": "\\((\\ddot r - r\\dot\\theta^2)\\,\\ur + (2\\dot r\\dot\\theta + r\\ddot\\theta)\\,\\ut\\)"}, {"id": "f26-polaires", "ch": "polaires", "q": "Circulaire uniforme : v et a ?", "r": "\\(v = R\\omega\\), \\(\\A = -R\\omega^2\\,\\ur\\)"}, {"id": "f27-polaires", "ch": "polaires", "q": "Volume élémentaire en cylindriques ?", "r": "\\(dV = r\\,dr\\,d\\theta\\,dz\\)"}, {"id": "f28-osc", "ch": "osc", "q": "Force de rappel ?", "r": "\\(\\vec F = -k\\,\\Delta l\\,\\vec u_x\\)"}, {"id": "f29-osc", "ch": "osc", "q": "Équation de l’oscillateur harmonique ?", "r": "\\(\\ddot x + \\omega_0^2 x = 0\\), \\(\\omega_0 = \\sqrt{k/m}\\)"}, {"id": "f30-osc", "ch": "osc", "q": "Solution avec x₀ et v₀ ?", "r": "\\(x = x_0\\cos\\omega_0t + \\frac{v_0}{\\omega_0}\\sin\\omega_0t\\)"}, {"id": "f31-osc", "ch": "osc", "q": "Période propre masse-ressort ?", "r": "\\(T_0 = 2\\pi\\sqrt{m/k}\\)"}, {"id": "f32-osc", "ch": "osc", "q": "Énergie mécanique de l’oscillateur ?", "r": "\\(E_M = \\frac12kA^2\\)"}, {"id": "f33-pendule", "ch": "pendule", "q": "Équation du pendule (petits angles) ?", "r": "\\(\\ddot\\theta + \\frac gl\\theta = 0\\)"}, {"id": "f34-pendule", "ch": "pendule", "q": "Période du pendule simple ?", "r": "\\(T_0 = 2\\pi\\sqrt{l/g}\\)"}, {"id": "f35-pendule", "ch": "pendule", "q": "Oscillateur amorti : équation ?", "r": "\\(\\ddot x + \\frac1\\tau\\dot x + \\omega_0^2x = 0\\)"}, {"id": "f36-pendule", "ch": "pendule", "q": "Les trois régimes ?", "r": "λ < ω₀ pseudo-périodique, λ = ω₀ critique, λ > ω₀ apériodique"}, {"id": "f37-ondes", "ch": "ondes", "q": "Longueur d’onde ?", "r": "\\(\\lambda = cT = \\frac cf\\)"}, {"id": "f38-ondes", "ch": "ondes", "q": "OPPM ?", "r": "\\(s = A\\cos(\\omega t - kx + \\varphi)\\), \\(k = \\frac\\omega c\\)"}, {"id": "f39-ondes", "ch": "ondes", "q": "Opposition de phase ?", "r": "Δφ = π"}, {"id": "f40-ondes", "ch": "ondes", "q": "Corde fixée aux deux bouts ?", "r": "\\(\\lambda_n = \\frac{2L}{n}\\), \\(f_n = \\frac{nc}{2L}\\)"}], "figs": {"PROJ_X": "<svg viewBox=\"0 0 330 260\" class=\"fig-svg\" role=\"img\" aria-label=\"Angle mesuré depuis Ox\"><line x1=\"70\" y1=\"220\" x2=\"300\" y2=\"220\" class=\"ln ln-ink3\" stroke-width=\"1.5\" marker-end=\"url(#ar-ink3)\"/><line x1=\"70\" y1=\"220\" x2=\"70\" y2=\"40\" class=\"ln ln-ink3\" stroke-width=\"1.5\" marker-end=\"url(#ar-ink3)\"/><text x=\"306\" y=\"225\" class=\"tx tx-ink2\" text-anchor=\"start\" font-size=\"14\" font-style=\"italic\">x<\/text><text x=\"70\" y=\"32\" class=\"tx tx-ink2\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">y<\/text><text x=\"62\" y=\"240\" class=\"tx tx-ink2\" text-anchor=\"end\" font-size=\"14\">O<\/text><line x1=\"225.6\" y1=\"111\" x2=\"2   }, { passive: true });

  /* ---------- Révision espacée ---------- */
  var BOX = [0, 1, 3, 7, 14, 30];
  function dueCards() { var t = today(); return FI.filter(function (f) { var s = S.srs[f.id]; return !s || s.d <= t; }); }

  /* ---------- Accueil ---------- */
  function chapterProgress(c) {
    var n = (LE[c.id] || []).length, seen = Math.min(S.lu[c.id] || 0, n);
    var qs = Q.filter(function (q) { return q.ch === c.id; }), ok = qs.filter(function (q) { return S.qcm[q.id] && S.qcm[q.id].ok; }).length;
    return { lu: seen, n: n, ok: ok, nq: qs.length };
  }

      '<span class="s">' + (withResume ? esc(c.resume) : (c.td ? c.td + ' · ' : '') + p.lu + '/' + p.n + ' fiches · QCM ' + p.ok + '/' + p.nq) + '</span>' +
      (withResume ? '' : '<span class="meter"><i style="width:' + Math.round(100 * p.lu / Math.max(p.n, 1)) + '%"></i></span>') + '</span><span class="chev">›</span></a>';
  }

    var target = lastCh || CH.filter(function (c) { var p = chapterProgress(c); return p.lu < p.n; })[0] || CH[1];

      '<div class="sec-title"><h2>Plus</h2></div><div class="list">' +

      '<a class="item" href="installer.html"><span class="grow"><span class="t">Installer ou partager l’appli</span><span class="s">QR code et lien pour ta promo</span></span><span class="chev">›</span></a>' +
      '<a class="item" href="#/apropos"><span class="grow"><span class="t">Sources et méthode</span><span class="s">D’où vient le contenu, tes données</span></span><span class="chev">›</span></a></div></div>');
  }

  /* ---------- Cours ---------- */
  function coursList() {

  function figHtml(key) {

  function lesson(id, i) {
    var c = chById[id], cards = LE[id];

      (last ? '<div class="list" style="margin-top:14px"><a class="item" href="#/qcm/go/' + id + '"><span class="num">?</span><span class="grow"><span class="t">Teste-toi sur ce chapitre</span><span class="s">QCM, correction immédiate</span></span><span class="chev">›</span></a>' +
        (c.td ? '<a class="item" href="#/exos/' + id + '"><span class="num">✎</span><span class="grow"><span class="t">Exercices du ' + c.td + '</span><span class="s">Corrigés étape par étape</span></span><span class="chev">›</span></a>' : '') + '</div>' : '') +

  /* ---------- QCM ---------- */
  var run = null;
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function qcmSetup() {
    tab('qcm'); header('QCM');
    var wrong = Q.filter(function (q) { return S.qcm[q.id] && !S.qcm[q.id].ok; }).length;
    render('<div class="stack"><p class="muted" style="margin:0">Une question à la fois, correction immédiate. Se tester fait mieux retenir que relire.</p>' +
      '<a class="btn full" href="#/qcm/go/tout">10 questions mélangées</a>' +
      (wrong ? '<a class="btn sec full" href="#/qcm/go/erreurs">Refaire mes erreurs (' + wrong + ')</a>' : '') +
      '<div class="card"><h2>Choisir les chapitres</h2><div class="chips" id="chips" style="margin-top:12px">' +
      CH.map(function (c) { return '<button class="chip" type="button" data-ch="' + c.id + '" aria-pressed="false">' + c.n + '. ' + esc(c.titre) + '</button>'; }).join('') +
      '</div><button class="btn full" type="button" id="goSel" disabled style="margin-top:14px">Lancer</button></div></div>');
    $$('#chips .chip').forEach(function (b) { b.addEventListener('click', function () {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      $('#goSel').disabled = !$$('#chips .chip[aria-pressed="true"]').length;
    }); });
    $('#goSel').addEventListener('click', function () { go('#/qcm/go/' + $$('#chips .chip[aria-pressed="true"]').map(function (x) { return x.dataset.ch; }).join(',')); });
  }
  function qcmStart(scope) {
    var pool;
    if (scope === 'tout') pool = Q.slice();
    else if (scope === 'erreurs') pool = Q.filter(function (q) { return S.qcm[q.id] && !S.qcm[q.id].ok; });
    else { var ids = scope.split(','); pool = Q.filter(function (q) { return ids.indexOf(q.ch) >= 0; }); }
    if (!pool.length) { location.replace('#/qcm'); return; }
    shuffle(pool);
    pool.sort(function (a, b) { var w = function (q) { return S.qcm[q.id] ? (S.qcm[q.id].ok ? 2 : 0) : 1; }; return w(a) - w(b); });
    run = { scope: scope, qs: shuffle(pool.slice(0, scope === 'tout' ? 10 : 12)), i: 0, ok: 0, miss: [] };
    location.replace('#/qcm/q');
  }
  function qcmQuestion() {
    if (!run) { location.replace('#/qcm'); return; }
    if (run.i >= run.qs.length) return qcmEnd();
    var q = run.qs[run.i], c = chById[q.ch];
    tab('qcm'); header('QCM', (run.i + 1) + ' / ' + run.qs.length, run.i / run.qs.length, '#/qcm');
    render('<div class="card"><p class="meta">' + esc(c.titre) + (q.multi ? ' · <b>plusieurs réponses</b>' : '') + '</p>' +
      '<p class="q-text">' + q.q + '</p><div class="opts">' +
      q.opts.map(function (o) { return '<button class="opt" type="button" data-k="' + o[0] + '"><span class="k">' + o[0].toUpperCase() + '</span><span>' + o[1] + '</span></button>'; }).join('') +
      '</div><div id="fb"></div></div>' +
      '<div class="actions one" id="qAct">' + (q.multi ? '<button class="btn" type="button" id="valid" disabled>Valider</button>' : '<button class="btn sec" type="button" disabled>Choisis une réponse</button>') + '</div>' +
      '<p class="kbd-hint">Clavier : touches A, B, C, D puis Entrée</p>');
    var answered = false;
    function next() { run.i++; qcmQuestion(); }
    function finish(chosen) {
      if (answered) return; answered = true;
      var good = q.ans.split(','), ok = chosen.slice().sort().join(',') === good.slice().sort().join(',');
      $$('.opt', view).forEach(function (b) { b.disabled = true; var k = b.dataset.k; if (good.indexOf(k) >= 0) b.classList.add('ok'); else if (chosen.indexOf(k) >= 0) b.classList.add('ko'); });
      if (ok) run.ok++; else run.miss.push(q);
      S.qcm[q.id] = { ok: ok, n: ((S.qcm[q.id] || {}).n || 0) + 1 }; save();
      var fb = $('#fb');
      fb.innerHTML = '<div class="fb"><b class="' + (ok ? 'ok' : 'ko') + '">' + (ok ? 'Juste.' : 'Pas tout à fait.') + '</b> ' + q.expl + '</div>';
      typeset(fb);
      $('#qAct').innerHTML = '<button class="btn" type="button" id="nextQ">' + (run.i + 1 < run.qs.length ? 'Question suivante' : 'Voir mon score') + '</button>';
      $('#nextQ').addEventListener('click', next);
      keys = { Enter: next, ArrowRight: next };
    }
    function pick(b) {
      if (answered) return;
      if (q.multi) { b.classList.toggle('sel'); $('#valid').disabled = !$$('.opt.sel', view).length; }
      else finish([b.dataset.k]);
    }
    $$('.opt', view).forEach(function (b) { b.addEventListener('click', function () { pick(b); }); });
    var v = $('#valid'); if (v) v.addEventListener('click', function () { var ch = $$('.opt.sel', view).map(function (b) { return b.dataset.k; }); if (ch.length) finish(ch); });
    keys = {};
    q.opts.forEach(function (o) { keys[o[0]] = keys[o[0].toUpperCase()] = function () { var b = $('.opt[data-k="' + o[0] + '"]', view); if (b) pick(b); }; });
    keys.Enter = function () { var vv = $('#valid'); if (vv && !vv.disabled) vv.click(); };
  }
  function qcmEnd() {
    tab('qcm'); header('QCM', null, 1, '#/qcm');
    var n = run.qs.length, pct = Math.round(100 * run.ok / n);
    var msg = pct >= 80 ? 'Très bien. Reviens demain pour consolider.' : pct >= 50 ? 'Bien parti. Refais tes erreurs, puis relis les fiches concernées.' : 'Relis les fiches de ces chapitres, puis réessaie.';
    var missCh = {}; run.miss.forEach(function (q) { missCh[q.ch] = true; });
    render('<div class="card" style="text-align:center"><p class="label">Score</p><p class="score">' + run.ok + ' / ' + n + '</p><p class="muted">' + msg + '</p></div>' +
      (Object.keys(missCh).length ? '<div class="sec-title"><h2>À revoir</h2></div><div class="list">' + Object.keys(missCh).map(function (id) { return chapterRow(chById[id], true); }).join('') + '</div>' : '') +

  }

  function exo(id, step) {

      '<div class="card"><div class="steps-dots" aria-hidden="true">' + e.etapes.map(function (_, j) { return '<i' + (j <= step ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' +

  /* ---------- Fiches mémoire ---------- */
  var deck = null;
  function fiches() {
    tab('fiches');
    if (!deck) deck = shuffle(dueCards().slice());
    if (!deck.length) {
      header('Fiches');
      var next = FI.map(function (f) { return S.srs[f.id] ? S.srs[f.id].d : today(); }).filter(function (d) { return d > today(); }).sort(function (a, b) { return a - b; })[0];
      render('<div class="card" style="text-align:center"><h1>Rien à revoir aujourd’hui</h1><p class="muted">Chaque fiche revient après 1, 3, 7, 14 puis 30 jours : c’est la révision espacée.' + (next ? ' Prochaines fiches dans ' + (next - today()) + ' jour' + (next - today() > 1 ? 's' : '') + '.' : '') + '</p></div>' +
        '<div class="actions one"><button class="btn sec" type="button" id="all">Revoir toutes les fiches quand même</button></div>');
      $('#all').onclick = function () { deck = shuffle(FI.slice()); fiches(); };
      return;
    }
    var f = deck[0], shown = false;
    header('Fiches', deck.length + ' à revoir', null);
    render('<div class="card flash" id="flash" role="button" tabindex="0" aria-label="Retourner la fiche"><p class="meta" style="margin:0">' + esc(chById[f.ch].titre) + '</p><div class="front">' + f.q + '</div>' +
      '<div class="answer" id="answer" hidden>' + f.r + '</div><div class="tap" id="tapHint">Réponds de tête, puis touche la fiche</div></div>' +
      '<div class="actions one" id="fAct"><button class="btn" type="button" id="show">Voir la réponse</button></div>');
    function reveal() {
      if (shown) return; shown = true;
      $('#answer').hidden = false; $('#tapHint').hidden = true;
      $('#fAct').className = 'actions';
      $('#fAct').innerHTML = '<button class="btn sec" type="button" id="no">À revoir</button><button class="btn" type="button" id="yes">Je savais</button>';
      $('#yes').onclick = yes; $('#no').onclick = no;
      keys = { '1': no, '2': yes, ArrowLeft: no, ArrowRight: yes };
    }
    function yes() { var s = S.srs[f.id] || { b: 0 }; var b = Math.min((s.b || 0) + 1, 5); S.srs[f.id] = { b: b, d: today() + BOX[b] }; save(); deck.shift(); fiches(); }
    function no() { S.srs[f.id] = { b: 1, d: today() }; save(); deck.push(deck.shift()); fiches(); }
    $('#show').onclick = reveal;
    $('#flash').onclick = reveal;
    $('#flash').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } };
    keys = { ' ': reveal, Enter: reveal };
  }
