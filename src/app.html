<style>
/* Une seule colonne de lecture (36rem), un écran = une idée, navigation en bas. Fond uni, couleur réservée au sens. */
:root {

  --accent-ink: #FFFFFF;
  --good: #1D7A45;
  --good-soft: #E6F4EC;
  --bad: #B93226;
  --bad-soft: #FBEAE8;
  --v: #1262D2;
  --a: #C8371D;
  --u1: #7A3BD0;
  --u2: #0B8574;
  --area: rgba(18, 98, 210, 0.08);
  --grid: #E1E4EA;

    --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --grid: #2B2F39;

}

  --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --grid: #2B2F39;

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* ---------- Barre du haut ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }

.bar { height: 3px; background: var(--line); }

/* ---------- Contenu ---------- */
main { max-width: 40rem; margin: 0 auto; padding: 20px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.stack { display: grid; gap: 14px; }
.stack > *, .duo > *, .pager > * { min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.88rem; }
.panel { background: var(--surface); border-radius: var(--r); padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.row > .grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; cursor: pointer; }

.btn.full { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }

/* Listes cliquables */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 56px; }
.item:hover { filter: brightness(0.98); }
.num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; background: var(--bg); color: var(--ink-2); }
.num.done { background: var(--good); color: var(--bg); }
.item .t { font-weight: 700; display: block; }

.meter i { display: block; height: 100%; background: var(--good); }
.chev { color: var(--ink-3); flex: 0 0 auto; }

.trap b { color: var(--bad); }

.dots i.on { background: var(--accent); }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { margin: 0.4em 0 !important; overflow-x: auto; overflow-y: hidden; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 0.92rem; min-height: 40px; }

.q-text { font-size: 1.12rem; font-weight: 700; margin: 6px 0 14px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 54px; background: var(--surface); border: 2px solid transparent; border-radius: var(--r); padding: 10px 14px; cursor: pointer; overflow-x: auto; }
.opt .k { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; background: var(--bg); color: var(--ink-2); }
.opt.sel { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .k { background: var(--good); color: var(--bg); }
.opt.ko { border-color: var(--bad); background: var(--bad-soft); }
.opt.ko .k { background: var(--bad); color: var(--bg); }
.opt:disabled { cursor: default; }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); }
.fb b.ok { color: var(--good); }
.fb b.ko { color: var(--bad); }
.score { font-size: 2.6rem; font-weight: 700; line-height: 1; }

/* ---------- Exercices ---------- */
.enonce { background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
.step-q { font-weight: 700; margin: 4px 0 10px; }
textarea { width: 100%; min-height: 110px; resize: vertical; font: 1rem/1.5 var(--f); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
textarea:focus { border-color: var(--accent); outline: none; }
.hint { margin-top: 10px; padding: 10px 14px; border-radius: var(--r); background: var(--surface); font-size: 0.95rem; }
.corr { margin-top: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--good-soft); overflow-x: auto; }
.tag { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface); color: var(--ink-2); }

/* ---------- Fiches mémoire ---------- */
.flash { min-height: 260px; display: grid; align-content: center; gap: 12px; text-align: center; background: var(--surface); border-radius: 16px; padding: 24px 18px; }
.flash .front { font-size: 1.15rem; font-weight: 700; }
.flash .backside { font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 14px; overflow-x: auto; }

/* ---------- Navigation du bas ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav a { display: grid; justify-items: center; align-content: center; gap: 2px; text-decoration: none; color: var(--ink-3); font-size: 0.72rem; font-weight: 700; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 0.7rem; line-height: 18px; text-align: center; }

/* ---------- Toast de mise à jour ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px 12px 18px; box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 0.95rem; }
.toast button { border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 700; border: 1.5px solid var(--bg); }
.toast .go { background: var(--bg); color: var(--ink); }
.toast .later { background: transparent; color: var(--bg); }

/* ---------- Schémas (SVG) ---------- */
.fig-svg { width: 100%; height: auto; display: block; }
.fig-svg.mini, .fig-svg.half { max-width: 460px; margin: 0 auto; }
.fig-svg.icon { max-width: 160px; margin: 0 auto; }
.ln { fill: none; stroke-linecap: round; }
.ln-ink { stroke: var(--ink); } .ln-ink2 { stroke: var(--ink-2); } .ln-ink3 { stroke: var(--ink-3); }
.ln-v { stroke: var(--v); } .ln-a { stroke: var(--a); } .ln-u1 { stroke: var(--u1); } .ln-u2 { stroke: var(--u2); }
.mk-ink { fill: var(--ink); } .mk-ink2 { fill: var(--ink-2); } .mk-ink3 { fill: var(--ink-3); }
.mk-v { fill: var(--v); } .mk-a { fill: var(--a); } .mk-u1 { fill: var(--u1); } .mk-u2 { fill: var(--u2); }
.tx { font-family: var(--f); }
.tx-ink { fill: var(--ink); } .tx-ink2 { fill: var(--ink-2); } .tx-ink3 { fill: var(--ink-3); }
.tx-v { fill: var(--v); } .tx-a { fill: var(--a); } .tx-u1 { fill: var(--u1); } .tx-u2 { fill: var(--u2); }
.dot-ink { fill: var(--ink); } .dot-ink2 { fill: var(--ink-2); } .dot-ink3 { fill: var(--ink-3); }
.area { fill: var(--area); stroke: none; }
.cv { color: var(--v); } .ca { color: var(--a); } .c1 { color: var(--u1); } .c2 { color: var(--u2); }
.polar-ctl { display: grid; gap: 8px; margin-top: 8px; }
.polar-ctl input { width: 100%; accent-color: var(--accent); }

</style>

  function qcmStart(scope) {

  /* ---------- Schéma polaire interactif ---------- */
  function initPolar() {
    var svg = $('#polarSvg'), range = $('#theta'); if (!svg || !range) return;
    var O = { x: 250, y: 205 }, RHO = 140, U = 72;
    function L(x1, y1, x2, y2, c, w, dash, arrow) { return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" class="ln ln-' + c + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + (arrow ? ' marker-end="url(#ar-' + c + ')"' : '') + '/>'; }
    function T(x, y, s, c, anchor, size, weight) { return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" class="tx tx-' + c + '" text-anchor="' + (anchor || 'start') + '" font-size="' + (size || 15) + '"' + (weight ? ' font-weight="' + weight + '"' : '') + '>' + s + '</text>'; }
    function draw(deg) {
      var t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
      var M = { x: O.x + RHO * c, y: O.y - RHO * s }, ur = { x: c, y: -s }, ut = { x: -s, y: -c }, h = '';
      h += '<circle cx="' + O.x + '" cy="' + O.y + '" r="' + RHO + '" class="ln ln-ink3" stroke-width="1" stroke-dasharray="3 5" fill="none"/>';
      h += L(30, O.y, 490, O.y, 'ink3', 1.4, null, true) + L(O.x, 385, O.x, 22, 'ink3', 1.4, null, true);
      h += T(496, O.y + 5, 'x', 'ink2', 'start', 14) + T(O.x + 10, 26, 'y', 'ink2', 'start', 14) + T(O.x - 8, O.y + 20, 'O', 'ink2', 'end', 14);
      h += L(M.x, M.y, M.x, O.y, 'ink3', 1.2, '5 5') + L(M.x, M.y, O.x, M.y, 'ink3', 1.2, '5 5');
      h += T(M.x, O.y + (s >= 0 ? 22 : -10), 'x = r cos θ', 'ink2', 'middle', 13);
      h += T(O.x + (c >= 0 ? -8 : 8), M.y + 4, 'y = r sin θ', 'ink2', c >= 0 ? 'end' : 'start', 13);
      var r = 38; if (deg > 0) h += '<path d="M' + (O.x + r) + ' ' + O.y + ' A' + r + ' ' + r + ' 0 ' + (deg > 180 ? 1 : 0) + ' 0 ' + (O.x + r * c).toFixed(1) + ' ' + (O.y - r * s).toFixed(1) + '" class="ln ln-ink" stroke-width="1.6" fill="none"/>';
      h += T(O.x + 56 * Math.cos(t / 2) - 4, O.y - 56 * Math.sin(t / 2) + 5, 'θ', 'ink', 'middle', 16, 700);
      h += L(O.x, O.y, M.x, M.y, 'ink', 2.2) + T((O.x + M.x) / 2 + 18 * ut.x, (O.y + M.y) / 2 + 18 * ut.y + 5, 'r', 'ink', 'middle', 16, 700);
      var e1 = { x: M.x + U * ur.x, y: M.y + U * ur.y }, e2 = { x: M.x + U * ut.x, y: M.y + U * ut.y };
      h += L(M.x, M.y, e1.x, e1.y, 'u1', 3.2, null, true) + L(M.x, M.y, e2.x, e2.y, 'u2', 3.2, null, true);
      var sub = function (g) { return '<tspan font-weight="700">u</tspan><tspan dy="5" font-size="0.75em" font-weight="700">' + g + '</tspan>'; };
      h += T(e1.x + 18 * ur.x, e1.y + 18 * ur.y + 5, sub('r'), 'u1', 'middle', 17) + T(e2.x + 18 * ut.x, e2.y + 18 * ut.y + 5, sub('θ'), 'u2', 'middle', 17);
      h += '<circle cx="' + M.x.toFixed(1) + '" cy="' + M.y.toFixed(1) + '" r="5" class="dot-ink"/>' + T(M.x - 14 * ur.x - 12 * ut.x, M.y - 14 * ur.y - 12 * ut.y + 5, 'M', 'ink', 'middle', 16, 700);
      svg.innerHTML = h; $('#thetaVal').textContent = deg + '°';
    }
    range.addEventListener('input', function () { draw(+range.value); });
    draw(35);
  }

  /* ---------- Routeur ---------- */
  function route() {
    var h = location.hash || '#/', p = h.slice(2).split('/');
    if (h.indexOf('#/cours/') === 0 || h.indexOf('#/exo/') === 0) { S.last = h; save(); }
    if (p[0] === '' ) return home();
    if (p[0] === 'cours') return p[1] ? lesson(p[1], parseInt(p[2], 10)) : coursList();
    if (p[0] === 'qcm') { if (p[1] === 'go') return qcmStart(p[2] || 'tout'); if (p[1] === 'q') return qcmQuestion(); return qcmSetup(); }
    if (p[0] === 'exos') return exosList(p[1]);
    if (p[0] === 'exo') return exo(p[1], parseInt(p[2], 10));
    if (p[0] === 'fiches') { deck = null; return fiches(); }
    if (p[0] === 'annales') return annales();
    if (p[0] === 'apropos') return apropos();
    notFound();
  }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- Mise à jour de l'appli ---------- */
  var toast = $('#updToast'), waiting = null, updating = false;
  $('#updGo').addEventListener('click', function () { if (!waiting) return; updating = true; this.textContent = 'Mise à jour…'; waiting.postMessage('skipWaiting'); });
  $('#updLater').addEventListener('click', function () { toast.hidden = true; });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        function offer(w) { waiting = w; toast.hidden = false; }
        if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
        reg.addEventListener('updatefound', function () { var w = reg.installing; if (!w) return; w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
      }).catch(function () {});
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (updating) { updating = false; location.reload(); } });
    });
  }
})();
</script>
