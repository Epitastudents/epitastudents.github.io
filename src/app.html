<title>Mécanique S1</title>
<meta name="description" content="Révisions de mécanique S1 : le cours en fiches courtes, QCM corrigés, exercices de TD guidés et cartes mémoire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Mise en page : téléphone = onglets en bas ; PC = menu à gauche. Une colonne de lecture de 44rem.
   Les boutons d'action restent collés en bas de l'écran. Couleur réservée au sens (vecteurs, juste/faux, action). */
:root {
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --line: #E4E7EC;
  --soft: #EEF1F5;
  --ink: #14171C;
  --ink-2: #4A5160;
  --ink-3: #8A91A1;
  --accent: #2F5BEA;
  --accent-soft: #E8EEFD;
  --accent-ink: #FFFFFF;
  --good: #187A43;
  --good-soft: #E3F4EA;
  --bad: #B8332A;
  --bad-soft: #FCEBEA;
  --v: #1262D2; --a: #C8371D; --u1: #7A3BD0; --u2: #0B8574;
  --area: rgba(18, 98, 210, 0.08);
  --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 2px 8px rgba(20, 23, 28, 0.04);
  --f: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fh: "Lexend", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  --nav-h: 62px;
  --side: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --card: #181B21; --line: #2A2E37; --soft: #22262E; --ink: #ECEEF2; --ink-2: #AEB4C1; --ink-3: #7A8090;
    --accent: #86A6FF; --accent-soft: #1E2740; --accent-ink: #0D1120; --good: #5BC98A; --good-soft: #142A1D; --bad: #FF8C80; --bad-soft: #301917;
    --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --card: #181B21; --line: #2A2E37; --soft: #22262E; --ink: #ECEEF2; --ink-2: #AEB4C1; --ink-3: #7A8090;
  --accent: #86A6FF; --accent-soft: #1E2740; --accent-ink: #0D1120; --good: #5BC98A; --good-soft: #142A1D; --bad: #FF8C80; --bad-soft: #301917;
  --v: #6AAEFF; --a: #FF7F64; --u1: #BC95FF; --u2: #3FD0B6; --area: rgba(106, 174, 255, 0.12); --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 var(--f); }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--fh); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.15rem; }
p { margin: 0.5rem 0; }
ul, ol { margin: 0.5rem 0; padding-left: 1.3rem; }
li + li { margin-top: 0.35rem; }

/* ---------- Structure ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 46rem; margin: 0 auto; padding-inline: 16px; height: 56px; display: flex; align-items: center; gap: 8px; }
.back { flex: 0 0 auto; width: 40px; height: 40px; margin-left: -8px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.back:hover { background: var(--soft); }
.back svg { width: 22px; height: 22px; }
.top-title { flex: 1; min-width: 0; font-family: var(--fh); font-weight: 600; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-count { font-size: 0.86rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; border-radius: 0 2px 2px 0; }
main { max-width: 46rem; margin: 0 auto; padding: 12px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); outline: none; }
.stack { display: grid; gap: 14px; }
.stack > *, .duo > *, .actions > * { min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.88rem; }
.label { font-family: var(--fh); font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; cursor: pointer; user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.sec { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { position: sticky; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: grid; grid-template-columns: 1fr 1.7fr; gap: 10px; margin-top: 18px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px rgba(20, 23, 28, 0.10); }
.actions.one { grid-template-columns: 1fr; }
.kbd-hint { text-align: center; font-size: 0.8rem; color: var(--ink-3); margin-top: 8px; }

/* ---------- Listes ---------- */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 64px; }
.item:hover { border-color: var(--ink-3); }
.item .grow { flex: 1; min-width: 0; }
.num { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--fh); font-weight: 600; font-size: 0.95rem; background: var(--accent-soft); color: var(--accent); }
.num.done { background: var(--good); color: var(--card); }
.item .t { font-weight: 700; display: block; line-height: 1.3; }
.item .s { display: block; font-size: 0.86rem; color: var(--ink-2); margin-top: 2px; }
.meter { height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.chev { color: var(--ink-3); flex: 0 0 auto; font-size: 1.4rem; line-height: 1; }

/* ---------- Accueil ---------- */
.hello { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; margin: 8px 0 2px; }
.resume { display: block; text-decoration: none; color: var(--ink); background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow); }
.resume .label { color: inherit; opacity: 0.85; }
.resume .t { display: block; font-family: var(--fh); font-size: 1.25rem; font-weight: 600; margin: 4px 0 10px; }
.resume .meter { background: rgba(255,255,255,0.3); }
.resume .meter i { background: var(--accent-ink); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); padding: 14px; }
.tile b { font-family: var(--fh); font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.tile span { font-size: 0.9rem; color: var(--ink-2); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }

/* ---------- Fiche de cours ---------- */
.lesson h1 { font-size: 1.45rem; margin-bottom: 8px; }
.meta { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 6px; }
.key { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 16px 0; overflow-x: auto; }
.key .label { display: block; color: var(--accent); margin-bottom: 2px; }
.trap { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); font-size: 0.95rem; }
.trap b { color: var(--bad); }
.fig { margin: 16px 0 0; }
.fig svg { max-height: min(38vh, 320px); max-width: 100%; display: block; margin: 0 auto; }
.fig-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 0.8rem; color: var(--ink-2); }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { margin: 0.35em 0 !important; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

/* ---------- QCM ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--card); color: var(--ink); cursor: pointer; font-size: 0.92rem; min-height: 42px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.q-text { font-size: 1.15rem; font-weight: 700; line-height: 1.45; margin: 4px 0 16px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 58px; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 10px 14px; cursor: pointer; overflow-x: auto; }
.opt:hover:not(:disabled) { border-color: var(--ink-3); }
.opt .k { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--fh); font-weight: 600; font-size: 0.85rem; background: var(--soft); color: var(--ink-2); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .k { background: var(--good); color: var(--card); }
.opt.ko { border-color: var(--bad); background: var(--bad-soft); }
.opt.ko .k { background: var(--bad); color: var(--card); }
.opt:disabled { cursor: default; }
.fb { margin-top: 14px; padding: 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.fb b.ok { color: var(--good); }
.fb b.ko { color: var(--bad); }
.score { font-family: var(--fh); font-size: 3rem; font-weight: 700; line-height: 1; margin: 8px 0; }

/* ---------- Exercices ---------- */
.enonce { font-size: 0.95rem; }
.step-q { font-weight: 700; font-size: 1.05rem; margin: 0 0 10px; }
textarea { display: block; width: 100%; min-height: 96px; resize: vertical; font: 1rem/1.5 var(--f); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
textarea:focus { border-color: var(--accent); outline: none; background: var(--card); }
.reveal { margin-top: 10px; padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.reveal.hint { background: var(--soft); }
.reveal.corr { background: var(--good-soft); }
.tag { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-2); margin-right: 4px; }
.steps-dots { display: flex; gap: 5px; margin: 2px 0 10px; }
.steps-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps-dots i.on { background: var(--accent); }

/* ---------- Fiches mémoire ---------- */
.flash { min-height: 300px; display: grid; align-content: center; gap: 14px; text-align: center; cursor: pointer; }
.flash .front { font-family: var(--fh); font-size: 1.2rem; font-weight: 600; }
.flash .answer { font-size: 1.1rem; border-top: 1px dashed var(--line); padding-top: 14px; overflow-x: auto; }
.flash .tap { font-size: 0.85rem; color: var(--ink-3); }

/* ---------- Navigation ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 46rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav a { display: grid; justify-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--ink-3); font-size: 0.72rem; font-weight: 700; position: relative; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav .brand-side { display: none; }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 0.68rem; line-height: 18px; text-align: center; }

@media (min-width: 960px) {
  body { padding-left: var(--side); }
  .nav { top: 0; right: auto; width: var(--side); border-top: 0; border-right: 1px solid var(--line); padding: 20px 12px; }
  .nav-in { display: grid; grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px; height: auto; max-width: none; }
  .nav .brand-side { display: block; font-family: var(--fh); font-weight: 700; font-size: 1.15rem; color: var(--ink); padding: 4px 12px 18px; }
  .nav a { display: flex; align-items: center; gap: 12px; justify-items: start; padding: 10px 12px; border-radius: 10px; font-size: 0.98rem; color: var(--ink-2); }
  .nav a:hover { background: var(--soft); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav a svg { width: 22px; height: 22px; }
  .badge { position: static; margin-left: auto; }
  main { padding-bottom: 40px; padding-top: 18px; }
  .actions { bottom: 16px; }
  .top-in, main { max-width: 48rem; }
}

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px 12px 18px; box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 0.95rem; }
.toast button { border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 700; border: 0; background: var(--bg); color: var(--ink); }

/* ---------- Schémas ---------- */
.fig-svg { width: 100%; height: auto; display: block; max-height: min(42vh, 360px); }
.fig-svg.mini, .fig-svg.half { max-width: 460px; margin: 0 auto; }
.fig-svg.icon { max-width: 160px; margin: 0 auto; }
.ln { fill: none; stroke-linecap: round; }
.ln-ink { stroke: var(--ink); } .ln-ink2 { stroke: var(--ink-2); } .ln-ink3 { stroke: var(--ink-3); }
.ln-v { stroke: var(--v); } .ln-a { stroke: var(--a); } .ln-u1 { stroke: var(--u1); } .ln-u2 { stroke: var(--u2); }
.mk-ink { fill: var(--ink); } .mk-ink2 { fill: var(--ink-2); } .mk-ink3 { fill: var(--ink-3); }
.mk-v { fill: var(--v); } .mk-a { fill: var(--a); } .mk-u1 { fill: var(--u1); } .mk-u2 { fill: var(--u2); }
.tx { font-family: var(--f); }
.tx-ink { fill: var(--ink); } .tx-ink2 { fill: var(--ink-2); } .tx-ink3 { fill: var(--ink-3); }
.tx-v { fill: var(--v); } .tx-a { fill: var(--a); } .tx-u1 { fill: var(--u1); } .tx-u2 { fill: var(--u2); }
.dot-ink { fill: var(--ink); } .dot-ink2 { fill: var(--ink-2); } .dot-ink3 { fill: var(--ink-3); }
.area { fill: var(--area); stroke: none; }
.cv { color: var(--v); } .ca { color: var(--a); } .c1 { color: var(--u1); } .c2 { color: var(--u2); }
.polar-ctl { display: grid; gap: 6px; margin-top: 8px; }
.polar-ctl input { width: 100%; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var CH = D.chapitres, LE = D.lecons, Q = D.qcm, EX = D.exos, FI = D.fiches;
  var chById = {}; CH.forEach(function (c) { chById[c.id] = c; });
  var KEY = 'meca-s1-v2';
  function fresh() { return { lu: {}, qcm: {}, exo: {}, rep: {}, srs: {}, last: null }; }
  var S = fresh();
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') Object.keys(S).forEach(function (k) { if (o[k] !== undefined && o[k] !== null) S[k] = o[k]; }); } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var view = $('#view');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); }
  function go(h) { if (location.hash === h) route(); else location.hash = h; }

  /* ---------- Formules ---------- */
  var pending = [];
  window.__mjPending = function () { var p = pending; pending = []; p.forEach(typeset); };
  function typeset(el) {
    if (!el) return;
    if (window.__mjReady && window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([el]).catch(function () {}); }
    else pending.push(el);
  }

  /* ---------- En-tête, onglets, raccourcis ---------- */
  var keys = null, swipe = null;
  function header(title, count, progress, back) {
    $('#topTitle').textContent = title;
    $('#topCount').textContent = count || '';
    var bar = $('#topBar');
    if (progress == null) bar.hidden = true; else { bar.hidden = false; $('i', bar).style.width = Math.round(progress * 100) + '%'; }
    var b = $('#topBack'); b.hidden = !back; b.onclick = back ? function () { go(back); } : null;
  }
  function tab(name) {
    $$('.nav a').forEach(function (a) { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var n = dueCards().length, bd = $('#navBadge'); bd.hidden = !n; bd.textContent = n;
  }
  function render(html) { keys = null; swipe = null; view.innerHTML = html; window.scrollTo(0, 0); typeset(view); }
  document.addEventListener('keydown', function (e) {
    if (!keys || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var f = keys[e.key]; if (f) { e.preventDefault(); f(); }
  });
  var tx = null, ty = null;
  view.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  view.addEventListener('touchend', function (e) {
    if (tx == null || !swipe) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && !(e.target.closest && e.target.closest('input, textarea, .fig, mjx-container'))) { if (dx < 0 && swipe.next) swipe.next(); if (dx > 0 && swipe.prev) swipe.prev(); }
  }, { passive: true });

  /* ---------- Révision espacée ---------- */
  var BOX = [0, 1, 3, 7, 14, 30];
  function dueCards() { var t = today(); return FI.filter(function (f) { var s = S.srs[f.id]; return !s || s.d <= t; }); }

  /* ---------- Accueil ---------- */
  function chapterProgress(c) {
    var n = (LE[c.id] || []).length, seen = Math.min(S.lu[c.id] || 0, n);
    var qs = Q.filter(function (q) { return q.ch === c.id; }), ok = qs.filter(function (q) { return S.qcm[q.id] && S.qcm[q.id].ok; }).length;
    return { lu: seen, n: n, ok: ok, nq: qs.length };
  }
  function chapterRow(c, withResume) {
    var p = chapterProgress(c), done = p.n > 0 && p.lu >= p.n;
    return '<a class="item" href="#/cours/' + c.id + '"><span class="num' + (done ? ' done' : '') + '">' + c.n + '</span><span class="grow"><span class="t">' + esc(c.titre) + '</span>' +
      '<span class="s">' + (withResume ? esc(c.resume) : (c.td ? c.td + ' · ' : '') + p.lu + '/' + p.n + ' fiches · QCM ' + p.ok + '/' + p.nq) + '</span>' +
      (withResume ? '' : '<span class="meter"><i style="width:' + Math.round(100 * p.lu / Math.max(p.n, 1)) + '%"></i></span>') + '</span><span class="chev">›</span></a>';
  }
  function home() {
    tab('home'); header('Mécanique S1');
    var due = dueCards().length;
    var lastCh = null;
    if (S.last) { var m = S.last.match(/^#\/cours\/(\w+)/); if (m && chById[m[1]]) lastCh = chById[m[1]]; }
    var target = lastCh || CH.filter(function (c) { var p = chapterProgress(c); return p.lu < p.n; })[0] || CH[1];
    var tp = chapterProgress(target);
    var okQ = Q.filter(function (q) { return S.qcm[q.id] && S.qcm[q.id].ok; }).length;
    render('<div class="stack">' +
      '<a class="resume" href="' + (lastCh ? S.last : '#/cours/' + target.id) + '"><span class="label">' + (S.last ? 'Continuer' : 'Commencer') + '</span>' +
      '<span class="t">' + target.n + '. ' + esc(target.titre) + '</span><span class="meter"><i style="width:' + Math.round(100 * tp.lu / Math.max(tp.n, 1)) + '%"></i></span></a>' +
      '<div class="tiles"><a class="tile" href="#/fiches"><b>' + due + '</b><span>fiche' + (due > 1 ? 's' : '') + ' à revoir</span></a>' +
      '<a class="tile" href="#/qcm/go/tout"><b>' + okQ + '<small style="font-size:1rem;color:var(--ink-3)">/' + Q.length + '</small></b><span>QCM réussis · lancer</span></a></div>' +
      '<p class="small muted" style="margin:2px 2px 0">Évaluation : 4 QCM Moodle (10 %) et 2 partiels (90 %). Le plus efficace : un peu de QCM et de fiches chaque jour.</p>' +
      '<div class="sec-title"><h2>Chapitres</h2></div><div class="list">' + CH.map(function (c) { return chapterRow(c, false); }).join('') + '</div>' +
      '<div class="sec-title"><h2>Plus</h2></div><div class="list">' +
      '<a class="item" href="#/annales"><span class="grow"><span class="t">Anciens sujets</span><span class="s">Contrôles 2017–2022 et partiels (Epidocs)</span></span><span class="chev">›</span></a>' +
      '<a class="item" href="installer.html"><span class="grow"><span class="t">Installer ou partager l’appli</span><span class="s">QR code et lien pour ta promo</span></span><span class="chev">›</span></a>' +
      '<a class="item" href="#/apropos"><span class="grow"><span class="t">Sources et méthode</span><span class="s">D’où vient le contenu, tes données</span></span><span class="chev">›</span></a></div></div>');
  }

  /* ---------- Cours ---------- */
  function coursList() {
    tab('cours'); header('Cours');
    render('<div class="stack"><p class="muted" style="margin:0">Une idée par écran. Glisse ou utilise les flèches du clavier pour avancer.</p><div class="list">' +
      CH.map(function (c) { return chapterRow(c, true); }).join('') + '</div></div>');
  }
  function figHtml(key) {
    if (!key) return '';
    if (key === 'POLAR') return '<div class="fig"><svg id="polarSvg" viewBox="0 0 520 400" class="fig-svg" role="img" aria-label="Base polaire au point M"></svg><div class="polar-ctl"><label for="theta" class="small muted">Fais varier θ : <b id="thetaVal">35°</b></label><input type="range" id="theta" min="0" max="359" value="35"></div></div>';
    return D.figs[key] ? '<div class="fig">' + D.figs[key] + '</div>' : '';
  }
  function lesson(id, i) {
    var c = chById[id], cards = LE[id];
    if (!c || !cards) return notFound();
    if (isNaN(i)) i = Math.min(S.lu[id] || 0, cards.length - 1);
    i = Math.max(0, Math.min(i, cards.length - 1));
    var k = cards[i], last = i === cards.length - 1;
    S.lu[id] = Math.max(S.lu[id] || 0, i + 1); save();
    tab('cours'); header(c.n + '. ' + c.titre, (i + 1) + ' / ' + cards.length, (i + 1) / cards.length, '#/cours');
    var prevH = i > 0 ? '#/cours/' + id + '/' + (i - 1) : null, nextH = last ? null : '#/cours/' + id + '/' + (i + 1);
    render('<article class="card lesson">' +
      (i === 0 ? '<p class="meta">' + esc(c.pages) + (c.td ? ' · ' + c.td : '') + '</p>' : '') +
      '<h1>' + k.t + '</h1>' + (k.h || '') +
      (k.k ? '<div class="key"><span class="label">À retenir</span>' + k.k + '</div>' : '') +
      figHtml(k.fig) +
      (k.piege ? '<p class="trap"><b>Attention.</b> ' + k.piege + '</p>' : '') +
      '<div class="dots" aria-hidden="true">' + cards.map(function (_, j) { return '<i' + (j === i ? ' class="on"' : '') + '></i>'; }).join('') + '</div></article>' +
      (last ? '<div class="list" style="margin-top:14px"><a class="item" href="#/qcm/go/' + id + '"><span class="num">?</span><span class="grow"><span class="t">Teste-toi sur ce chapitre</span><span class="s">QCM, correction immédiate</span></span><span class="chev">›</span></a>' +
        (c.td ? '<a class="item" href="#/exos/' + id + '"><span class="num">✎</span><span class="grow"><span class="t">Exercices du ' + c.td + '</span><span class="s">Corrigés étape par étape</span></span><span class="chev">›</span></a>' : '') + '</div>' : '') +
      '<div class="actions">' + (prevH ? '<a class="btn sec" href="' + prevH + '">Précédent</a>' : '<a class="btn sec" href="#/cours">Chapitres</a>') +
      (nextH ? '<a class="btn" href="' + nextH + '">Suivant</a>' : '<a class="btn" href="#/qcm/go/' + id + '">Faire le QCM</a>') + '</div>');
    if (k.fig === 'POLAR') initPolar();
    swipe = { next: nextH ? function () { go(nextH); } : null, prev: prevH ? function () { go(prevH); } : null };
    keys = { ArrowRight: swipe.next || function () {}, ArrowLeft: swipe.prev || function () {} };
  }

  /* ---------- QCM ---------- */
  var run = null;
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function qcmSetup() {
    tab('qcm'); header('QCM');
    var wrong = Q.filter(function (q) { return S.qcm[q.id] && !S.qcm[q.id].ok; }).length;
    render('<div class="stack"><p class="muted" style="margin:0">Une question à la fois, correction immédiate. Se tester fait mieux retenir que relire.</p>' +
      '<a class="btn full" href="#/qcm/go/tout">10 questions mélangées</a>' +
      (wrong ? '<a class="btn sec full" href="#/qcm/go/erreurs">Refaire mes erreurs (' + wrong + ')</a>' : '') +
      '<div class="card"><h2>Choisir les chapitres</h2><div class="chips" id="chips" style="margin-top:12px">' +
      CH.map(function (c) { return '<button class="chip" type="button" data-ch="' + c.id + '" aria-pressed="false">' + c.n + '. ' + esc(c.titre) + '</button>'; }).join('') +
      '</div><button class="btn full" type="button" id="goSel" disabled style="margin-top:14px">Lancer</button></div></div>');
    $$('#chips .chip').forEach(function (b) { b.addEventListener('click', function () {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      $('#goSel').disabled = !$$('#chips .chip[aria-pressed="true"]').length;
    }); });
    $('#goSel').addEventListener('click', function () { go('#/qcm/go/' + $$('#chips .chip[aria-pressed="true"]').map(function (x) { return x.dataset.ch; }).join(',')); });
  }
  function qcmStart(scope) {
    var pool;
    if (scope === 'tout') pool = Q.slice();
    else if (scope === 'erreurs') pool = Q.filter(function (q) { return S.qcm[q.id] && !S.qcm[q.id].ok; });
    else { var ids = scope.split(','); pool = Q.filter(function (q) { return ids.indexOf(q.ch) >= 0; }); }
    if (!pool.length) { location.replace('#/qcm'); return; }
    shuffle(pool);
    pool.sort(function (a, b) { var w = function (q) { return S.qcm[q.id] ? (S.qcm[q.id].ok ? 2 : 0) : 1; }; return w(a) - w(b); });
    run = { scope: scope, qs: shuffle(pool.slice(0, scope === 'tout' ? 10 : 12)), i: 0, ok: 0, miss: [] };
    location.replace('#/qcm/q');
  }
  function qcmQuestion() {
    if (!run) { location.replace('#/qcm'); return; }
    if (run.i >= run.qs.length) return qcmEnd();
    var q = run.qs[run.i], c = chById[q.ch];
    tab('qcm'); header('QCM', (run.i + 1) + ' / ' + run.qs.length, run.i / run.qs.length, '#/qcm');
    render('<div class="card"><p class="meta">' + esc(c.titre) + (q.multi ? ' · <b>plusieurs réponses</b>' : '') + '</p>' +
      '<p class="q-text">' + q.q + '</p><div class="opts">' +
      q.opts.map(function (o) { return '<button class="opt" type="button" data-k="' + o[0] + '"><span class="k">' + o[0].toUpperCase() + '</span><span>' + o[1] + '</span></button>'; }).join('') +
      '</div><div id="fb"></div></div>' +
      '<div class="actions one" id="qAct">' + (q.multi ? '<button class="btn" type="button" id="valid" disabled>Valider</button>' : '<button class="btn sec" type="button" disabled>Choisis une réponse</button>') + '</div>' +
      '<p class="kbd-hint">Clavier : touches A, B, C, D puis Entrée</p>');
    var answered = false;
    function next() { run.i++; qcmQuestion(); }
    function finish(chosen) {
      if (answered) return; answered = true;
      var good = q.ans.split(','), ok = chosen.slice().sort().join(',') === good.slice().sort().join(',');
      $$('.opt', view).forEach(function (b) { b.disabled = true; var k = b.dataset.k; if (good.indexOf(k) >= 0) b.classList.add('ok'); else if (chosen.indexOf(k) >= 0) b.classList.add('ko'); });
      if (ok) run.ok++; else run.miss.push(q);
      S.qcm[q.id] = { ok: ok, n: ((S.qcm[q.id] || {}).n || 0) + 1 }; save();
      var fb = $('#fb');
      fb.innerHTML = '<div class="fb"><b class="' + (ok ? 'ok' : 'ko') + '">' + (ok ? 'Juste.' : 'Pas tout à fait.') + '</b> ' + q.expl + '</div>';
      typeset(fb);
      $('#qAct').innerHTML = '<button class="btn" type="button" id="nextQ">' + (run.i + 1 < run.qs.length ? 'Question suivante' : 'Voir mon score') + '</button>';
      $('#nextQ').addEventListener('click', next);
      keys = { Enter: next, ArrowRight: next };
    }
    function pick(b) {
      if (answered) return;
      if (q.multi) { b.classList.toggle('sel'); $('#valid').disabled = !$$('.opt.sel', view).length; }
      else finish([b.dataset.k]);
    }
    $$('.opt', view).forEach(function (b) { b.addEventListener('click', function () { pick(b); }); });
    var v = $('#valid'); if (v) v.addEventListener('click', function () { var ch = $$('.opt.sel', view).map(function (b) { return b.dataset.k; }); if (ch.length) finish(ch); });
    keys = {};
    q.opts.forEach(function (o) { keys[o[0]] = keys[o[0].toUpperCase()] = function () { var b = $('.opt[data-k="' + o[0] + '"]', view); if (b) pick(b); }; });
    keys.Enter = function () { var vv = $('#valid'); if (vv && !vv.disabled) vv.click(); };
  }
  function qcmEnd() {
    tab('qcm'); header('QCM', null, 1, '#/qcm');
    var n = run.qs.length, pct = Math.round(100 * run.ok / n);
    var msg = pct >= 80 ? 'Très bien. Reviens demain pour consolider.' : pct >= 50 ? 'Bien parti. Refais tes erreurs, puis relis les fiches concernées.' : 'Relis les fiches de ces chapitres, puis réessaie.';
    var missCh = {}; run.miss.forEach(function (q) { missCh[q.ch] = true; });
    render('<div class="card" style="text-align:center"><p class="label">Score</p><p class="score">' + run.ok + ' / ' + n + '</p><p class="muted">' + msg + '</p></div>' +
      (Object.keys(missCh).length ? '<div class="sec-title"><h2>À revoir</h2></div><div class="list">' + Object.keys(missCh).map(function (id) { return chapterRow(chById[id], true); }).join('') + '</div>' : '') +
      '<div class="actions">' + '<a class="btn sec" href="#/qcm/go/' + run.scope + '">Nouvelle série</a>' +
      (run.miss.length ? '<a class="btn" href="#/qcm/go/erreurs">Refaire mes erreurs</a>' : '<a class="btn" href="#/">Accueil</a>') + '</div>');
  }

  /* ---------- Exercices ---------- */
  function exosList(chId) {
    tab('exos');
    var list = chId ? EX.filter(function (e) { return e.ch === chId; }) : EX;
    header(chId ? 'TD · ' + chById[chId].titre : 'Exercices de TD', null, null, chId ? '#/exos' : null);
    var groups = {}; list.forEach(function (e) { (groups[e.td] = groups[e.td] || []).push(e); });
    var html = '<div class="stack"><p class="muted" style="margin:0">Essaie d’abord, écris ta réponse, puis regarde l’indice ou la correction.</p>';
    Object.keys(groups).sort().forEach(function (td) {
      html += '<div class="sec-title"><h2>' + td + '</h2><span class="small muted">' + esc(chById[groups[td][0].ch].titre) + '</span></div><div class="list">' + groups[td].map(function (e) {
        var st = S.exo[e.id];
        return '<a class="item" href="#/exo/' + e.id + '"><span class="num' + (st === 'ok' ? ' done' : '') + '">' + (st === 'ok' ? '✓' : e.niv) + '</span><span class="grow"><span class="t">' + esc(e.titre) + '</span><span class="s">' + esc(e.tag) + ' · ' + e.etapes.length + ' étapes' + (st === 'revoir' ? ' · à revoir' : '') + '</span></span><span class="chev">›</span></a>';
      }).join('') + '</div>';
    });
    render(html + '<p class="small muted">Le chiffre indique la difficulté (1 à 3).</p></div>');
  }
  function exo(id, step) {
    var e = EX.filter(function (x) { return x.id === id; })[0];
    if (!e) return notFound();
    var n = e.etapes.length;
    if (isNaN(step)) step = 0;
    tab('exos');
    if (step >= n) {
      header(e.titre, null, 1, '#/exos/' + e.ch);
      render('<div class="card" style="text-align:center"><h1>Exercice terminé</h1><p class="muted">Saurais-tu le refaire seul, sans regarder ?</p></div>' +
        '<div class="actions"><button class="btn sec" type="button" id="exKo">À revoir</button><button class="btn" type="button" id="exOk">Oui, réussi</button></div>');
      $('#exOk').onclick = function () { S.exo[id] = 'ok'; save(); go('#/exos/' + e.ch); };
      $('#exKo').onclick = function () { S.exo[id] = 'revoir'; save(); go('#/exos/' + e.ch); };
      return;
    }
    var s = e.etapes[step], key = id + '-' + step;
    header(e.titre, 'Étape ' + (step + 1) + ' / ' + n, (step + 1) / n, '#/exos/' + e.ch);
    var prevH = step > 0 ? '#/exo/' + id + '/' + (step - 1) : '#/exos/' + e.ch, nextH = '#/exo/' + id + '/' + (step + 1);
    render('<div class="stack">' +
      '<details class="card enonce"' + (step === 0 ? ' open' : '') + '><summary style="cursor:pointer;font-weight:700">Énoncé</summary><div style="margin-top:8px">' +
      (step === 0 ? '<p style="margin-top:0"><span class="tag">' + esc(e.td) + '</span><span class="tag">' + esc(e.tag) + '</span></p>' : '') + e.enonce + figHtml(e.fig) +
      '<p class="small muted" style="margin-bottom:0">' + (e.officiel ? 'Correction tirée du corrigé officiel du TD.' : 'Correction proposée : le TD n’a pas encore de corrigé sur Moodle.') + '</p></div></details>' +
      '<div class="card"><div class="steps-dots" aria-hidden="true">' + e.etapes.map(function (_, j) { return '<i' + (j <= step ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' +
      '<p class="step-q">' + s[0] + '</p><textarea id="rep" placeholder="Ta réponse (calculs, idées)…" aria-label="Ta réponse"></textarea>' +
      '<div class="duo" style="margin-top:10px"><button class="btn sec" type="button" id="hintB">Indice</button><button class="btn sec" type="button" id="corrB">Correction</button></div>' +
      '<div class="reveal hint" id="hint" hidden><b>Indice.</b> ' + s[1] + '</div><div class="reveal corr" id="corr" hidden><b>Correction.</b> ' + s[2] + '</div></div>' +
      '<div class="actions"><a class="btn sec" href="' + prevH + '">' + (step > 0 ? 'Précédent' : 'Liste') + '</a><a class="btn" href="' + nextH + '">' + (step + 1 < n ? 'Étape suivante' : 'Terminer') + '</a></div></div>');
    if (e.fig === 'POLAR') initPolar();
    var ta = $('#rep'); ta.value = S.rep[key] || '';
    ta.addEventListener('input', function () { S.rep[key] = ta.value; save(); });
    $('#hintB').onclick = function () { $('#hint').hidden = false; };
    $('#corrB').onclick = function () { var c = $('#corr'); c.hidden = false; c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  }

  /* ---------- Fiches mémoire ---------- */
  var deck = null;
  function fiches() {
    tab('fiches');
    if (!deck) deck = shuffle(dueCards().slice());
    if (!deck.length) {
      header('Fiches');
      var next = FI.map(function (f) { return S.srs[f.id] ? S.srs[f.id].d : today(); }).filter(function (d) { return d > today(); }).sort(function (a, b) { return a - b; })[0];
      render('<div class="card" style="text-align:center"><h1>Rien à revoir aujourd’hui</h1><p class="muted">Chaque fiche revient après 1, 3, 7, 14 puis 30 jours : c’est la révision espacée.' + (next ? ' Prochaines fiches dans ' + (next - today()) + ' jour' + (next - today() > 1 ? 's' : '') + '.' : '') + '</p></div>' +
        '<div class="actions one"><button class="btn sec" type="button" id="all">Revoir toutes les fiches quand même</button></div>');
      $('#all').onclick = function () { deck = shuffle(FI.slice()); fiches(); };
      return;
    }
    var f = deck[0], shown = false;
    header('Fiches', deck.length + ' à revoir', null);
    render('<div class="card flash" id="flash" role="button" tabindex="0" aria-label="Retourner la fiche"><p class="meta" style="margin:0">' + esc(chById[f.ch].titre) + '</p><div class="front">' + f.q + '</div>' +
      '<div class="answer" id="answer" hidden>' + f.r + '</div><div class="tap" id="tapHint">Réponds de tête, puis touche la fiche</div></div>' +
      '<div class="actions one" id="fAct"><button class="btn" type="button" id="show">Voir la réponse</button></div>');
    function reveal() {
      if (shown) return; shown = true;
      $('#answer').hidden = false; $('#tapHint').hidden = true;
      $('#fAct').className = 'actions';
      $('#fAct').innerHTML = '<button class="btn sec" type="button" id="no">À revoir</button><button class="btn" type="button" id="yes">Je savais</button>';
      $('#yes').onclick = yes; $('#no').onclick = no;
      keys = { '1': no, '2': yes, ArrowLeft: no, ArrowRight: yes };
    }
    function yes() { var s = S.srs[f.id] || { b: 0 }; var b = Math.min((s.b || 0) + 1, 5); S.srs[f.id] = { b: b, d: today() + BOX[b] }; save(); deck.shift(); fiches(); }
    function no() { S.srs[f.id] = { b: 1, d: today() }; save(); deck.push(deck.shift()); fiches(); }
    $('#show').onclick = reveal;
    $('#flash').onclick = reveal;
    $('#flash').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } };
    keys = { ' ': reveal, Enter: reveal };
  }

  /* ---------- Annales et à propos ---------- */
  function annales() {
    tab('home'); header('Anciens sujets', null, null, '#/');
    render('<div class="stack"><p class="muted" style="margin:0">D’anciens <b>contrôles</b> (2017 à 2022), avant le format actuel en QCM et partiels. Toujours utiles pour la cinématique. Source : dépôt public Epidocs.</p><div class="list">' +
      D.annales.map(function (a) { return '<div class="item" style="cursor:default"><span class="grow"><span class="t">' + esc(a[0]) + '</span><span class="s">' + esc(a[1]) + '</span></span>' +
        (a[2] ? '<a class="btn sec" href="' + a[2] + '" target="_blank" rel="noopener" style="min-height:40px;padding:6px 12px">Sujet</a>' : '') +
        (a[3] ? '<a class="btn sec" href="' + a[3] + '" target="_blank" rel="noopener" style="min-height:40px;padding:6px 12px">Corrigé</a>' : '') + '</div>'; }).join('') +
      '</div><a class="btn sec full" href="' + D.partiels + '" target="_blank" rel="noopener">Anciens partiels (dynamique, énergie)</a></div>');
  }
  function apropos() {
    tab('home'); header('Sources et méthode', null, null, '#/');
    render('<div class="card"><h2>D’où vient le contenu</h2><p>Du poly « Cours cinématique V4 », de la fiche coordonnées et des TD1 à TD8 de 2026 (Moodle), avec les notations du poly. Les corrections des TD1 à TD3 suivent les corrigés officiels ; celles des TD4 à TD8 sont proposées et signalées comme telles.</p>' +
      '<h2 style="margin-top:18px">Pourquoi l’appli est faite comme ça</h2><ul><li><b>Une idée par écran</b> : un cours découpé en étapes courtes, au rythme de l’élève, se comprend mieux (Rey et al., 2019).</li><li><b>Rien de décoratif</b> : ce qui n’a pas de rapport avec la leçon fait moins bien retenir. La couleur sert aux vecteurs et à la correction.</li><li><b>Se tester plutôt que relire</b> : tests et révision espacée sont les techniques les plus efficaces (Dunlosky et al., 2013).</li><li><b>Exemples guidés</b> : pour débuter, un exercice résolu étape par étape aide plus que chercher seul.</li></ul>' +
      '<h2 style="margin-top:18px">Tes données</h2><p>Tes réponses et ta progression restent sur cet appareil. Rien n’est envoyé.</p><button class="btn sec" type="button" id="wipe">Effacer ma progression</button><p class="small muted" id="wipeMsg"></p></div>');
    var armed = false;
    $('#wipe').onclick = function () {
      if (!armed) { armed = true; this.textContent = 'Confirmer : tout effacer'; return; }
      S = fresh(); save(); deck = null; this.textContent = 'Effacé'; $('#wipeMsg').textContent = 'Ta progression a été remise à zéro.';
    };
  }
  function notFound() { header('Mécanique S1'); render('<div class="card"><p>Page introuvable.</p><a class="btn" href="#/">Accueil</a></div>'); }

  /* ---------- Schéma polaire interactif ---------- */
  function initPolar() {
    var svg = $('#polarSvg'), range = $('#theta'); if (!svg || !range) return;
    var O = { x: 250, y: 205 }, R = 140, U = 72;
    function L(x1, y1, x2, y2, c, w, dash, arrow) { return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" class="ln ln-' + c + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + (arrow ? ' marker-end="url(#ar-' + c + ')"' : '') + '/>'; }
    function T(x, y, s, c, anchor, size, weight) { return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" class="tx tx-' + c + '" text-anchor="' + (anchor || 'start') + '" font-size="' + (size || 15) + '"' + (weight ? ' font-weight="' + weight + '"' : '') + '>' + s + '</text>'; }
    function draw(deg) {
      var t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
      var M = { x: O.x + R * c, y: O.y - R * s }, ur = { x: c, y: -s }, ut = { x: -s, y: -c }, h = '';
      h += '<circle cx="' + O.x + '" cy="' + O.y + '" r="' + R + '" class="ln ln-ink3" stroke-width="1" stroke-dasharray="3 5" fill="none"/>';
      h += L(30, O.y, 490, O.y, 'ink3', 1.4, null, true) + L(O.x, 385, O.x, 22, 'ink3', 1.4, null, true);
      h += T(496, O.y + 5, 'x', 'ink2', 'start', 14) + T(O.x + 10, 26, 'y', 'ink2', 'start', 14) + T(O.x - 8, O.y + 20, 'O', 'ink2', 'end', 14);
      h += L(M.x, M.y, M.x, O.y, 'ink3', 1.2, '5 5') + L(M.x, M.y, O.x, M.y, 'ink3', 1.2, '5 5');
      h += T(M.x, O.y + (s >= 0 ? 22 : -10), 'x = r cos θ', 'ink2', 'middle', 13);
      h += T(O.x + (c >= 0 ? -8 : 8), M.y + 4, 'y = r sin θ', 'ink2', c >= 0 ? 'end' : 'start', 13);
      var r = 38; if (deg > 0) h += '<path d="M' + (O.x + r) + ' ' + O.y + ' A' + r + ' ' + r + ' 0 ' + (deg > 180 ? 1 : 0) + ' 0 ' + (O.x + r * c).toFixed(1) + ' ' + (O.y - r * s).toFixed(1) + '" class="ln ln-ink" stroke-width="1.6" fill="none"/>';
      h += T(O.x + 56 * Math.cos(t / 2) - 4, O.y - 56 * Math.sin(t / 2) + 5, 'θ', 'ink', 'middle', 16, 700);
      h += L(O.x, O.y, M.x, M.y, 'ink', 2.2) + T((O.x + M.x) / 2 + 18 * ut.x, (O.y + M.y) / 2 + 18 * ut.y + 5, 'r', 'ink', 'middle', 16, 700);
      var e1 = { x: M.x + U * ur.x, y: M.y + U * ur.y }, e2 = { x: M.x + U * ut.x, y: M.y + U * ut.y };
      h += L(M.x, M.y, e1.x, e1.y, 'u1', 3.2, null, true) + L(M.x, M.y, e2.x, e2.y, 'u2', 3.2, null, true);
      var sub = function (g) { return '<tspan font-weight="700">u</tspan><tspan dy="5" font-size="0.75em" font-weight="700">' + g + '</tspan>'; };
      h += T(e1.x + 18 * ur.x, e1.y + 18 * ur.y + 5, sub('r'), 'u1', 'middle', 17) + T(e2.x + 18 * ut.x, e2.y + 18 * ut.y + 5, sub('θ'), 'u2', 'middle', 17);
      h += '<circle cx="' + M.x.toFixed(1) + '" cy="' + M.y.toFixed(1) + '" r="5" class="dot-ink"/>' + T(M.x - 14 * ur.x - 12 * ut.x, M.y - 14 * ur.y - 12 * ut.y + 5, 'M', 'ink', 'middle', 16, 700);
      svg.innerHTML = h; $('#thetaVal').textContent = deg + '°';
    }
    range.addEventListener('input', function () { draw(+range.value); });
    draw(35);
  }

  /* ---------- Routeur ---------- */
  function route() {
    var h = location.hash || '#/', p = h.slice(2).split('/');
    if (h.indexOf('#/cours/') === 0 || h.indexOf('#/exo/') === 0) { S.last = h; save(); }
    if (p[0] === '') return home();
    if (p[0] === 'cours') return p[1] ? lesson(p[1], parseInt(p[2], 10)) : coursList();
    if (p[0] === 'qcm') { if (p[1] === 'go') return qcmStart(p[2] || 'tout'); if (p[1] === 'q') return qcmQuestion(); return qcmSetup(); }
    if (p[0] === 'exos') return exosList(p[1]);
    if (p[0] === 'exo') return exo(p[1], parseInt(p[2], 10));
    if (p[0] === 'fiches') { deck = null; return fiches(); }
    if (p[0] === 'annales') return annales();
    if (p[0] === 'apropos') return apropos();
    notFound();
  }
  window.addEventListener('hashchange', route);
  $$('.nav a').forEach(function (a) { a.addEventListener('click', function (e) { if (location.hash === a.getAttribute('href') || (a.getAttribute('href') === '#/' && !location.hash)) { e.preventDefault(); route(); } }); });
  route();

  /* ---------- Mises à jour : la nouvelle version s'installe toute seule ---------- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloaded) return;
      var onHome = !location.hash || location.hash === '#/';
      if (onHome || document.visibilityState === 'hidden') { reloaded = true; location.reload(); }
      else { $('#updToast').hidden = false; $('#updGo').onclick = function () { reloaded = true; location.reload(); }; }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
      }).catch(function () {});
    });
  }
})();
</script>
